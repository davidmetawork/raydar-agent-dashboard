<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex" />
  <meta http-equiv="refresh" content="0;url=/#submissions" />
  <title>Raydar · Submissions</title>
  <script src="/auth-session.js"></script>
  <style>body{display:flex;align-items:flex-start;padding:32px 20px 20px}</style>
  <script>
    void RaydarAuth.session().catch(function () { return null; });
    function exchangeGoogleCredential(response) {
      return RaydarAuth.signIn(response.credential).then(function () {
        location.replace("/#submissions");
      });
    }
    void exchangeGoogleCredential;
    location.replace("/#submissions");
  </script>
</head>
<body><a href="/#submissions">Open Submissions</a></body>
</html>
