<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Health · Raydar</title>
<link rel="icon" href="https://webview-lake.vercel.app/assets/raydar-favicon.png?v=3" />
<link rel="stylesheet" href="/fonts/pp-grafier.css" />
<script src="/auth-session.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --cream:#F6F3E9; --ink:#16140F; --card:#FFFFFF; --line:#E9E3D5; --muted:#8C877B;
    --orange:#FF5E00; --good:#119865; --good-bg:#E4F4EC; --bad:#E5484D; --bad-bg:#FBE9E9;
    --warn:#C7791A; --warn-bg:#FAEEDC; --violet:#7F72FF; --violet-bg:#ECEAFE; --muted-bg:#EFEADE;
    --shadow:0 1px 2px rgba(20,16,8,.04), 0 8px 24px -12px rgba(20,16,8,.10);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:"Inter Variable",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px;line-height:1.5}
  .wrap{max-width:1100px;margin:0 auto;padding:28px 20px 80px}
  h1{font-family:"PP Grafier Display",serif;font-weight:600;font-size:30px;margin:0}
  h2{font-family:"PP Grafier Display",serif;font-weight:600;font-size:16px;margin:0 0 10px}
  .sub{color:var(--muted);margin:4px 0 0}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
  .banner{border-radius:16px;padding:20px 22px;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .banner .verdict{font-family:"PP Grafier Display",serif;font-size:24px;font-weight:600}
  .banner.ok{background:var(--good-bg);border:1px solid #BFE6D3}
  .banner.deg{background:var(--warn-bg);border:1px solid #EEDBB4}
  .banner.down{background:var(--bad-bg);border:1px solid #F3C9CA}
  .banner.unk{background:var(--violet-bg);border:1px solid #D4CFFB}
  .counts{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:10px}
  .tile{border:1px solid var(--line);border-radius:12px;padding:11px 13px;background:#fff;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;transition:transform .08s}
  .tile:hover{transform:translateY(-1px)}
  .tile .top{display:flex;align-items:center;gap:8px}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .s-OK .dot{background:var(--good)} .s-DEGRADED .dot{background:var(--warn)}
  .s-DOWN .dot{background:var(--bad)} .s-UNKNOWN .dot{background:var(--violet)}
  .s-PAUSED .dot{background:#BDB7A8}
  .s-DOWN{border-color:#F3C9CA;background:var(--bad-bg)}
  .s-DEGRADED{border-color:#EEDBB4;background:var(--warn-bg)}
  .s-UNKNOWN{border-color:#D4CFFB;background:var(--violet-bg)}
  .s-PAUSED{opacity:.62}
  .tile.acked{opacity:.55;border-style:dashed}
  .tile .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile .rs{color:var(--muted);font-size:12px;margin-top:3px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .group{margin-bottom:20px}
  .ghead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
  .ghead .n{color:var(--muted);font-size:12px}
  .detail{background:#FBFAF6;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:8px;font-size:13px}
  .detail dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0 0 10px}
  .detail dt{color:var(--muted)}
  /* Grid and flex children default to min-width:auto, so one long reason or a
     metrics blob widens the whole page. On a phone that means the board
     scrolls sideways — pin them to zero and let the text wrap instead. */
  .detail dd{margin:0;min-width:0;overflow-wrap:anywhere}
  .trow{display:flex;gap:8px;color:var(--muted);font-size:12px;padding:2px 0}
  .trow span{min-width:0;overflow-wrap:anywhere}
  button.act{font:inherit;border:1px solid var(--line);background:#fff;border-radius:9px;padding:6px 11px;cursor:pointer}
  button.act:hover{border-color:var(--ink)}
  a{color:var(--orange)}
  .gate{position:fixed;inset:0;background:rgba(246,243,233,.96);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:20}
  .err{color:var(--bad)}
  body.embed header .brand img, body.embed h1, body.embed .sub{display:none}
  body.embed header{margin-bottom:10px}
  body.embed .wrap{padding-top:10px}
  @media (max-width:700px){
    .grid{grid-template-columns:1fr} .wrap{padding:16px 12px 60px}
    /* Label above value, and one transition per block: a phone has no room
       for a two-column definition list or a three-column row. */
    .detail dl{grid-template-columns:1fr;gap:0}
    .detail dt{margin-top:8px;font-size:12px}
    .trow{flex-direction:column;gap:1px;padding:6px 0;border-top:1px solid var(--line)}
  }
</style>
</head>
<body>
<div class="gate" id="gate">
  <div style="font-family:'PP Grafier Display',serif;font-size:20px">Sign in to view Raydar health</div>
  <div id="gsi"></div>
  <div class="err" id="gateErr"></div>
</div>
<div class="wrap">
  <header>
    <div class="brand">
      <div>
        <h1>Health</h1>
        <div class="sub">Every Raydar system, checked every 2 minutes.</div>
      </div>
    </div>
    <button class="act" id="refresh">Refresh</button>
  </header>
  <div id="banner" class="banner unk">
    <div>
      <div class="verdict" id="verdict">Loading…</div>
      <div class="counts" id="counts"></div>
    </div>
    <div class="counts" id="stamp"></div>
  </div>
  <div id="groups"></div>
</div>
<script>
const $=(id)=>document.getElementById(id);
if(new URLSearchParams(location.search).has("embed")) document.body.classList.add("embed");
const AUTH={required:true,clientId:"",authenticated:false};
let CATALOG=[],GROUPS=[],OPEN=null;

const esc=(s)=>String(s??"").replace(/[&<>"']/g,(c)=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function ago(iso){
  const ms=Date.now()-Date.parse(iso||"");
  if(!isFinite(ms)||ms<0) return "—";
  const m=Math.round(ms/60000);
  if(m<1) return "just now";
  if(m<60) return m+"m ago";
  if(m<1440) return Math.floor(m/60)+"h ago";
  return Math.floor(m/1440)+"d ago";
}
async function api(path,opts){
  const r=await fetch(path,{credentials:"same-origin",...opts});
  if(r.status===401||r.status===403){ showGate(); throw new Error("auth"); }
  return r.json();
}

function render(data){
  CATALOG=data.catalog||[]; GROUPS=data.groups||[];
  const tiles=data.tiles||{};
  const overall=data.overall||"UNKNOWN";
  const cls=overall==="OK"?"ok":overall==="DOWN"?"down":overall==="DEGRADED"?"deg":"unk";
  $("banner").className="banner "+cls;
  const c=data.counts||{};
  $("verdict").textContent=
    overall==="OK"?"All systems go":
    overall==="DOWN"?((c.DOWN||0)+" system"+((c.DOWN||0)===1?"":"s")+" down"):
    overall==="DEGRADED"?((c.DEGRADED||0)+" degraded"):
    "Status unknown";
  $("counts").innerHTML=["OK","DEGRADED","DOWN","UNKNOWN","PAUSED"]
    .filter(k=>c[k]).map(k=>`<span>${c[k]} ${k.toLowerCase()}</span>`).join("");
  $("stamp").innerHTML=`<span>checked ${esc(ago(data.checkedAt))}</span>`;

  const rank={DOWN:0,DEGRADED:1,UNKNOWN:2,OK:3,PAUSED:4};
  $("groups").innerHTML=GROUPS.map(g=>{
    const items=CATALOG.filter(x=>x.group===g.id)
      .map(x=>({...x,t:tiles[x.id]||{state:"UNKNOWN",reason:"no data yet"}}))
      .sort((a,b)=>(rank[a.t.state]??9)-(rank[b.t.state]??9)||a.name.localeCompare(b.name));
    if(!items.length) return "";
    const bad=items.filter(i=>["DOWN","DEGRADED"].includes(i.t.state)).length;
    return `<div class="group">
      <div class="ghead"><h2>${esc(g.label)}</h2><span class="n">${items.length} checks${bad?` · ${bad} need attention`:""}</span></div>
      <div class="grid">${items.map(i=>`
        <button class="tile s-${esc(i.t.state)}${i.t.ackUntil?" acked":""}" data-id="${esc(i.id)}">
          <div class="top"><span class="dot"></span><span class="nm">${esc(i.name)}</span></div>
          <div class="rs">${esc(i.t.ackUntil?("acknowledged — "+(i.t.ackReason||"")):(i.t.reason||(i.t.state==="OK"?"healthy":"")))}</div>
        </button>`).join("")}</div>
      <div id="detail-${esc(g.id)}"></div>
    </div>`;
  }).join("");

  document.querySelectorAll(".tile").forEach(el=>el.onclick=()=>openTile(el.dataset.id));
  if(OPEN) openTile(OPEN,true);
}

async function openTile(id,keep){
  if(OPEN===id&&!keep){ OPEN=null; document.querySelectorAll("[id^=detail-]").forEach(d=>d.innerHTML=""); return; }
  OPEN=id;
  const item=CATALOG.find(x=>x.id===id); if(!item) return;
  document.querySelectorAll("[id^=detail-]").forEach(d=>d.innerHTML="");
  const host=$("detail-"+item.group); if(!host) return;
  host.innerHTML='<div class="detail">Loading…</div>';
  const d=await api("/api/health/tile?id="+encodeURIComponent(id)).catch(()=>null);
  if(!d||!d.ok){ host.innerHTML='<div class="detail">Could not load detail.</div>'; return; }
  const t=d.tile||{};
  const up=d.uptime||{};
  // A window we have not been watching long enough to fill is marked "*" —
  // an uptime number that quietly means "since 20 minutes ago" is a lie.
  const pct=(v)=>v==null?"—":v.pct+"%"+(v.clipped?"*":"");
  const clipped=[up.day,up.week,up.month].some(v=>v&&v.clipped);
  host.innerHTML=`<div class="detail">
    <dl>
      <dt>State</dt><dd><b>${esc(t.state||"UNKNOWN")}</b>${t.reason?" — "+esc(t.reason):""}</dd>
      <dt>Since</dt><dd>${esc(t.since||"—")} (${esc(ago(t.since))})</dd>
      <dt>Checked</dt><dd>${esc(ago(t.lastCheckedAt))}</dd>
      <dt>Uptime</dt><dd>24h ${pct(up.day)} · 7d ${pct(up.week)} · 30d ${pct(up.month)}${clipped?' <span style="opacity:.6">* window clipped to history start</span>':""}</dd>
      ${t.metrics?`<dt>Metrics</dt><dd>${esc(JSON.stringify(t.metrics))}</dd>`:""}
      ${d.note?`<dt>Note</dt><dd>${esc(d.note)}</dd>`:""}
      ${t.ackUntil?`<dt>Acknowledged</dt><dd>${esc(t.ackReason||"")} until ${esc(t.ackUntil)}</dd>`:""}
    </dl>
    <div style="margin-bottom:8px">
      ${d.probeUrl?`<a href="${esc(d.probeUrl)}" target="_blank" rel="noopener">probe endpoint ↗</a> · `:""}
      ${d.registry?`<a href="https://docs.raydar.xyz${esc(d.registry)}" target="_blank" rel="noopener">registry page ↗</a>`:""}
    </div>
    <div style="margin-bottom:8px">
      <button class="act" id="ackBtn">${t.ackUntil?"Clear acknowledgement":"Acknowledge…"}</button>
    </div>
    <div><b>Recent changes</b>${(d.transitions||[]).length?"":" — none recorded yet"}</div>
    ${(d.transitions||[]).slice(0,8).map(x=>`<div class="trow"><span>${esc(ago(x.t))}</span><span>${esc(x.from)} → <b>${esc(x.to)}</b></span><span>${esc(x.reason||"")}</span></div>`).join("")}
  </div>`;
  $("ackBtn").onclick=async()=>{
    if(t.ackUntil){
      await api("/api/health/ack",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id,minutes:0})});
      return load();
    }
    const reason=prompt("Why acknowledge "+item.name+"? (shown on the board)");
    if(!reason) return;
    const hours=Number(prompt("Mute for how many hours? (max 336)","24"));
    if(!isFinite(hours)||hours<=0) return;
    await api("/api/health/ack",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id,minutes:Math.round(hours*60),reason})});
    load();
  };
}

async function load(){
  try{
    const data=await api("/api/health/state");
    if(data.empty){
      $("verdict").textContent="No data yet";
      $("stamp").textContent="the tick has not run";
      CATALOG=data.catalog||[]; GROUPS=data.groups||[];
      render({catalog:CATALOG,groups:GROUPS,tiles:{},counts:{},overall:"UNKNOWN"});
      return;
    }
    render(data);
  }catch(e){ if(String(e.message)!=="auth") console.error(e); }
}

function showGate(){ $("gate").style.display="flex"; }
async function init(){
  const cfg=await fetch("/api/auth/config",{credentials:"same-origin"}).then(r=>r.json()).catch(()=>({}));
  AUTH.required=cfg.authRequired!==false; AUTH.clientId=cfg.clientId||"";
  if(!AUTH.required){ load(); setInterval(load,60000); return; }
  const session=await RaydarAuth.session().catch(()=>null);
  if(session?.authenticated){ $("gate").style.display="none"; load(); setInterval(load,60000); return; }
  showGate();
  (function start(){
    if(!(window.google&&google.accounts&&google.accounts.id)) return setTimeout(start,150);
    google.accounts.id.initialize({client_id:AUTH.clientId,callback:onCred});
    google.accounts.id.renderButton($("gsi"),{theme:"filled_black",size:"large",text:"signin_with",shape:"pill"});
  })();
}
async function onCred(resp){
  try{
    await RaydarAuth.signIn(resp.credential);
    $("gate").style.display="none"; load(); setInterval(load,60000);
  }catch(e){ $("gateErr").textContent="Sign-in failed. Try again."; }
}
$("refresh").onclick=load;
init();
</script>
</body>
</html>
