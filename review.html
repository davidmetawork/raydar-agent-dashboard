<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Review · Raydar</title>
<link rel="icon" type="image/png" href="https://webview-lake.vercel.app/assets/raydar-favicon.png?v=3" />
<link rel="stylesheet" href="/fonts/pp-grafier.css" />
<script src="/auth-session.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{--cream:#F6F3E9;--ink:#16140F;--ink2:#57534A;--ink3:#8C877B;--card:#fff;--line:#E9E3D5;--soft:#EFEADE;--orange:#FF5E00;--good:#119865;--goodbg:#E4F4EC;--warn:#B66A10;--warnbg:#FAEEDC;--bad:#D84242;--badbg:#FBE9E9;--violet:#6658DA;--violetbg:#ECEAFE;--shadow:0 1px 2px rgba(20,16,8,.04),0 12px 30px -18px rgba(20,16,8,.22)}
  *{box-sizing:border-box}html,body{margin:0}body{background:var(--cream);color:var(--ink);font:14px "Inter Variable",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;padding:28px clamp(14px,3.5vw,46px) 80px}body.embed{padding-top:8px}.wrap{max-width:1240px;margin:0 auto}h1,h2,h3{font-family:"PP Grafier Display",Georgia,serif;font-weight:400}a{color:inherit}.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--orange)}header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:16px}h1{font-size:36px;line-height:1;margin:4px 0 0}.sub{color:var(--ink2);margin:8px 0 0;max-width:720px}body.embed h1,body.embed .sub{display:none}body.embed header{margin-bottom:9px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.button{appearance:none;border:0;border-radius:10px;padding:9px 13px;font:750 12px "Inter Variable";cursor:pointer}.button:disabled{opacity:.45;cursor:default}.button.primary{background:var(--orange);color:#fff}.button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.button.warn{background:var(--warnbg);color:var(--warn)}.button.danger{background:var(--badbg);color:var(--bad)}.button.small{padding:6px 9px;font-size:11px}.summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin-bottom:12px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}.stat b{display:block;font-family:"PP Grafier Display",Georgia,serif;font-size:25px;font-weight:400}.stat span{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em;font-weight:800}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select,.field input,.field select,.field textarea,.audit-reason{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:inherit;padding:8px 10px}.toolbar input{min-width:230px;flex:1}.toolbar .fresh{margin-left:auto;color:var(--ink3);font-size:12px}.layout{display:grid;grid-template-columns:minmax(300px,.82fr) minmax(460px,1.35fr);gap:12px;align-items:start}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:10px}.panel-head h2{font-size:20px;margin:0}.panel-head span{font-size:11px;color:var(--ink3)}.panel-body{padding:9px 14px;border-top:1px solid var(--line)}.queue{max-height:calc(100vh - 270px);min-height:420px;overflow:auto;padding:7px}.qrow{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:11px;padding:11px;cursor:pointer;color:inherit}.qrow:hover{background:#FAF8F2}.qrow.on{background:#FFF3EB;border-color:#FFD0B2}.qtop,.meta,.chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.qtop{justify-content:space-between}.qname{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.qreason{font-size:12px;color:var(--ink2);margin-top:5px}.meta{font-size:10.5px;color:var(--ink3);margin-top:6px}.chip{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;font-size:9.5px;letter-spacing:.035em;text-transform:uppercase;font-weight:800;background:var(--soft);color:var(--ink2)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.good{background:var(--goodbg);color:var(--good)}.chip.violet{background:var(--violetbg);color:var(--violet)}.detail-empty,.empty{padding:28px;text-align:center;color:var(--ink3)}.detail{padding:17px}.detail h2{font-size:26px;margin:0}.detail-lede{color:var(--ink2);margin:5px 0 13px}.step{display:flex;gap:9px;align-items:flex-start;background:#FAF8F2;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin:12px 0}.step-num{width:22px;height:22px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}.step b{display:block}.step span{font-size:12px;color:var(--ink2)}.section{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.section h3{font-size:18px;margin:0 0 9px}.profiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.profile{border:1px solid var(--line);border-radius:11px;background:#fff;padding:10px;text-align:left;cursor:pointer}.profile:disabled{cursor:default;opacity:.6}.profile:hover,.profile.selected{border-color:var(--orange);box-shadow:0 0 0 2px #FFE6D6}.profile b{display:block}.profile span{display:block;color:var(--ink3);font-size:11px;margin-top:3px;overflow-wrap:anywhere}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.field label{display:block;color:var(--ink2);font-size:11px;font-weight:750;margin:0 0 4px}.field input,.field select,.field textarea{width:100%}.field textarea{min-height:78px;resize:vertical}.field.wide{grid-column:1/-1}.evidence{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.ev{border:1px solid var(--line);background:#FBFAF6;border-radius:10px;padding:9px;min-width:0}.ev .key{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--ink3)}.ev .value{margin-top:3px;color:var(--ink2);font-size:12px;overflow-wrap:anywhere;white-space:pre-wrap}.ev a,.banner a{color:inherit;font-weight:800}.review-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:11px}.audit-reason{width:100%;margin-top:10px}.hint{font-size:11.5px;color:var(--ink3);margin-top:6px}.banner{display:none;border-radius:11px;padding:11px 13px;margin-bottom:11px}.banner.on{display:block}.banner.bad{background:var(--badbg);color:var(--bad)}.banner.warn{background:var(--warnbg);color:var(--warn)}.banner.good{background:var(--goodbg);color:var(--good)}.timeline{display:flex;flex-direction:column;gap:8px}.event{border-left:2px solid var(--line);padding-left:10px}.event b{font-size:12px}.event div{font-size:11px;color:var(--ink3)}.gate{position:fixed;inset:0;background:rgba(246,243,233,.97);display:none;align-items:flex-start;justify-content:center;flex-direction:column;gap:14px;z-index:40;padding:32px 20px 20px}.toast{position:fixed;right:20px;bottom:20px;max-width:420px;background:var(--ink);color:#fff;border-radius:11px;padding:11px 14px;box-shadow:var(--shadow);z-index:50}.toast[hidden]{display:none}.toast.bad{background:var(--bad)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  @media(max-width:850px){.summary{grid-template-columns:repeat(2,1fr)}.layout{grid-template-columns:1fr}.queue{max-height:420px;min-height:0}.profiles,.fields,.evidence{grid-template-columns:1fr}}
  @media(max-width:520px){body{padding:16px 10px 60px}.summary{grid-template-columns:1fr 1fr}header{align-items:stretch}.top-actions{width:100%}.toolbar input{min-width:100%}.detail{padding:13px}}
</style>
</head>
<body>
<div class="gate" id="gate"><div style="font:26px 'PP Grafier Display',serif">Sign in to review blocked people</div><div id="gsi"></div><div id="gate-error" style="color:var(--bad)"></div></div>
<main class="wrap">
  <header><div><div class="eyebrow">People</div><h1>Review</h1><p class="sub">Every blocked post-call obligation in one queue, with the exact evidence, safe actions, and resume point.</p></div><div class="actions"><button class="button ghost" id="refresh">Refresh</button></div></header>
  <div class="banner" id="banner" role="status" aria-live="polite"></div>
  <section class="summary" aria-label="Review queue summary" id="summary"></section>
  <div class="toolbar">
    <label class="sr-only" for="search">Search review queue</label><input id="search" type="search" placeholder="Search reason, step, or obligation…" />
    <label class="sr-only" for="status">Review status</label><select id="status"><option value="open">Open</option><option value="resolved">Resolved</option><option value="all">All</option></select>
    <span class="fresh" id="fresh"></span>
  </div>
  <div class="layout">
    <section class="panel" aria-label="Review queue"><div class="panel-head"><h2>Needs attention</h2><span id="queue-count"></span></div><div class="queue" id="queue"></div><div class="panel-body" id="queue-more" hidden><button class="button ghost" id="load-more">Load more</button></div></section>
    <section class="panel" aria-label="Selected review item"><div id="detail" class="detail-empty">Select a person to see what blocked them and how to unblock the workflow.</div></section>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
const $=(id)=>document.getElementById(id);const params=new URLSearchParams(location.search);if(params.has("embed"))document.body.classList.add("embed");
const STATE={items:[],active:null,actor:null,config:null,busy:false,nextCursor:null,evidenceVersion:null};
const esc=(value)=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const label=(value)=>String(value||"").replace(/[_-]+/g," ").replace(/\b\w/g,c=>c.toUpperCase());
const when=(iso)=>{const ms=Date.now()-Date.parse(iso||"");if(!Number.isFinite(ms))return "Unknown time";const m=Math.max(0,Math.floor(ms/60000));return m<1?"Just now":m<60?`${m}m ago`:m<1440?`${Math.floor(m/60)}h ago`:`${Math.floor(m/1440)}d ago`};
function toast(message,bad=false){const el=$("toast");el.textContent=message;el.className="toast"+(bad?" bad":"");el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,5000)}
function showBanner(message,kind="warn"){const el=$("banner");el.className=`banner on ${kind}`;el.textContent=message}function clearBanner(){$("banner").className="banner"}
async function api(url,options={}){const response=await fetch(url,{credentials:"same-origin",cache:"no-store",...options,headers:{"content-type":"application/json",...(options.headers||{})}});const body=await response.json().catch(()=>({}));if(response.status===401||response.status===403){if(response.status===401)showGate();const error=new Error(body.detail||body.error||"Access denied");error.status=response.status;throw error}if(!response.ok||body.ok===false){const error=new Error(body.detail||body.error||"Request failed");error.status=response.status;error.body=body;throw error}return body}
function itemName(item){return item.evidence?.candidate?.name||item.evidence?.booking?.fullName||item.evidence?.candidateName||`Obligation ${String(item.obligationId||"").slice(-8)}`}
function canReviewWrite(){return Boolean(STATE.actor?.capabilities?.reviewWrite)}
function reasonClass(code){return /conflict|ambiguous|unsafe|failed/i.test(code||"")?"bad":/delivery|gmail|matching|calibration/i.test(code||"")?"violet":"warn"}
function filtered(){const q=$("search").value.trim().toLowerCase();return STATE.items.filter(item=>!q||[itemName(item),item.reasonCode,item.state,item.obligationId].some(v=>String(v||"").toLowerCase().includes(q)))}
function renderSummary(){const open=STATE.items.filter(i=>String(i.status||"open")==="open").length;const identity=STATE.items.filter(i=>/identity|profile|crm/i.test(i.reasonCode||i.state||"")).length;const data=STATE.items.filter(i=>/preference|field|resume|recipient/i.test(i.reasonCode||i.state||"")).length;const actionable=STATE.items.filter(i=>String(i.status||"open")==="open"&&(i.allowedActions||[]).some(action=>action!=="abandon")).length;$("summary").innerHTML=[[open,"Open"],[identity,"Identity & profile"],[data,"Missing information"],[actionable,"Actionable here"]].map(([n,l])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join("")}
function renderQueue(){const items=filtered();$("queue-count").textContent=`${items.length} shown${STATE.nextCursor?" · more available":""}`;$("queue").innerHTML=items.length?items.map(item=>`<button class="qrow ${STATE.active?.id===item.id?"on":""}" data-id="${esc(item.id)}" aria-pressed="${STATE.active?.id===item.id}"><div class="qtop"><span class="qname">${esc(itemName(item))}</span><span class="chip ${reasonClass(item.reasonCode)}">${esc(label(item.state||"open"))}</span></div><div class="qreason">${esc(label(item.reasonCode||"Review required"))}</div><div class="meta"><span>${esc(when(item.updatedAt||item.createdAt))}</span><span>·</span><span>${esc(label(item.state))}</span><span>·</span><span>v${Number(item.version)||0}</span></div></button>`).join(""):`<div class="empty">No review items match this view.</div>`;$("queue-more").hidden=!STATE.nextCursor;document.querySelectorAll(".qrow").forEach(el=>el.onclick=()=>select(el.dataset.id))}
function profiles(item){const raw=item.evidence?.profiles||item.evidence?.candidateProfiles||[];return Array.isArray(raw)?raw:[]}
function profileCards(item){const rows=profiles(item);if(!rows.length)return "";const readonly=canReviewWrite()?"":"disabled";return `<div class="section"><h3>Possible Paraform profiles</h3><div class="profiles">${rows.map((profile,index)=>{const id=profile.candidateUserId||profile.id||profile.profileId;const facts=[profile.email,profile.linkedinUrl,profile.talentNetwork?"Talent Network":null,profile.hasPreferences?"Preferences":null,profile.hasResume?"Résumé":null].filter(Boolean);return `<button class="profile" data-profile="${esc(id)}" ${readonly}><b>${esc(profile.name||`Profile ${index+1}`)}</b><span>${esc(facts.join(" · ")||id)}</span></button>`}).join("")}</div><p class="hint">Selecting a card only prepares the choice; save it with an audit reason below.</p></div>`}
const FIELD_OPTIONS={callOutcome:["completed_success","no_show","failed","incomplete","cancelled_or_rescheduled","ambiguous"],roleVerdict:["good","bad"],workplaces:["REMOTE","HYBRID","ON_SITE"],visaAuthorization:["NO_VISA_AUTHORIZATION_NEEDED","NEEDS_NEW_VISA_AUTHORIZATION"],fundingRounds:["PRE_SEED","SEED","SERIES_A","SERIES_B","SERIES_C","SERIES_D_PLUS","UNKNOWN"]};
const ARRAY_FIELDS=new Set(["locations","workplaces","fundingRounds"]),SYSTEM_FIELDS=new Set(["candidateUserId","confirmedAbsent","resumeToken"]);
function normalizedFields(item){return (item.allowedFields||[]).map(field=>typeof field==="string"?{name:field,label:label(field)}:field).filter(field=>field&&field.name&&!SYSTEM_FIELDS.has(field.name))}
function currentValue(item,name){return item.evidence?.current?.[name]??item.evidence?.candidate?.[name]??item.evidence?.booking?.[name]??""}
function fieldControls(item){const fields=normalizedFields(item);if(!fields.length)return "";const readonly=canReviewWrite()?"":"disabled";return `<div class="section"><h3>Information you can safely add</h3><div class="fields">${fields.map(field=>{const name=field.name,raw=currentValue(item,name),values=Array.isArray(raw)?raw.map(String):String(raw||"").split(",").map(value=>value.trim()).filter(Boolean),options=field.options||FIELD_OPTIONS[name];if(options){const multiple=ARRAY_FIELDS.has(name);return `<div class="field"><label for="field-${esc(name)}">${esc(field.label||label(name))}</label><select id="field-${esc(name)}" data-field="${esc(name)}" ${multiple?'data-kind="array" multiple size="4"':""} ${readonly}>${multiple?"":'<option value="">Choose…</option>'}${options.map(option=>`<option value="${esc(option)}" ${values.includes(String(option))?"selected":""}>${esc(label(option))}</option>`).join("")}</select>${multiple?'<p class="hint">Select every option that applies.</p>':""}</div>`}const list=ARRAY_FIELDS.has(name);return `<div class="field ${/notes|reason|address/i.test(name)?"wide":""}"><label for="field-${esc(name)}">${esc(field.label||label(name))}</label><input id="field-${esc(name)}" data-field="${esc(name)}" ${list?'data-kind="array"':''} ${name==="minimumBaseSalary"?'type="number" min="1" step="1000"':'type="text"'} value="${esc(Array.isArray(raw)?raw.join(", "):raw)}" autocomplete="off" ${readonly} />${list?'<p class="hint">Separate multiple values with commas.</p>':""}</div>`}).join("")}</div></div>`}
function flatEvidence(value,prefix="",rows=[]){if(rows.length>48)return rows;if(value==null||typeof value!=="object"){rows.push([prefix||"Value",value]);return rows}if(Array.isArray(value)){value.slice(0,12).forEach((item,index)=>flatEvidence(item,`${prefix||"Item"} ${index+1}`,rows));return rows}Object.entries(value).forEach(([key,item])=>{if(key==="profiles"||key==="candidateProfiles"||key==="audit")return;flatEvidence(item,prefix?`${prefix} · ${label(key)}`:label(key),rows)});return rows}
function evidenceHtml(item){const rows=flatEvidence(item.evidence||{});return `<div class="section"><h3>Evidence</h3><div class="evidence">${rows.length?rows.map(([key,value])=>{const isUrl=typeof value==="string"&&/^https:\/\//.test(value);return `<div class="ev"><div class="key">${esc(key)}</div><div class="value">${isUrl?`<a href="${esc(value)}" target="_blank" rel="noopener noreferrer">Open authoritative source ↗</a>`:esc(Array.isArray(value)?value.join(", "):value==null?"—":String(value))}</div></div>`}).join(""):`<div class="ev"><div class="value">No supporting evidence was exposed.</div></div>`}</div></div>`}
function auditHtml(item){const events=item.audit||item.evidence?.audit||[];if(!Array.isArray(events)||!events.length)return "";return `<div class="section"><h3>Audit history</h3><div class="timeline">${events.map(event=>`<div class="event"><b>${esc(label(event.action||event.type||"Event"))}</b><div>${esc(event.actor||event.by||"System")} · ${esc(when(event.at||event.createdAt))}</div>${event.reason?`<div>${esc(event.reason)}</div>`:""}</div>`).join("")}</div></div>`}
function actionButtons(item){if(!canReviewWrite())return '<div class="section"><h3>Resolve and continue</h3><p class="hint">You have read-only access; a Raydar reviewer must make and audit any change.</p></div>';const allowed=new Set(item.allowedActions||[]);const buttons=[];if(allowed.has("select_profile"))buttons.push(["select_profile","Use selected profile","primary"]);if(allowed.has("confirm_absent"))buttons.push(["confirm_absent","Confirm no profile exists","warn"]);if(allowed.has("set_field"))buttons.push(["set_field","Save information","primary"]);if(allowed.has("set_call_outcome"))buttons.push(["set_call_outcome","Save call outcome","primary"]);if(allowed.has("set_role_verdict"))buttons.push(["set_role_verdict","Save role verdict","primary"]);if(allowed.has("retry"))buttons.push(["retry","Retry blocked step","ghost"]);if(allowed.has("resume"))buttons.push(["resume","Resume workflow","primary"]);if(allowed.has("abandon"))buttons.push(["abandon","Close without sending","danger"]);return `<div class="section"><h3>Resolve and continue</h3>${allowed.has("attach_resume")?`<div class="field wide"><label for="resume">Attach a résumé (PDF, DOC, or DOCX; 20 MB maximum)</label><input id="resume" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" /><p class="hint">The workflow service verifies type, hash, malware scan, and Paraform readback before it can resume; the file is sent only to its one-time scoped upload URL and is never kept in Monitor browser storage.</p></div>`:""}<label class="sr-only" for="audit-reason">Audit reason</label><input class="audit-reason" id="audit-reason" placeholder="Why are you making this change? (required)" maxlength="1000" /><div class="review-actions">${buttons.map(([action,text,kind])=>`<button class="button ${kind}" data-action="${action}">${text}</button>`).join("")}${allowed.has("attach_resume")?`<button class="button ghost" data-action="attach_resume">Upload and attach résumé</button>`:""}</div><p class="hint">Only actions allowed for this blocker are shown; every change is attributed and checked again before the workflow resumes.</p></div>`}
function renderDetail(){const item=STATE.active;if(!item){$("detail").className="detail-empty";$("detail").textContent="Select a person to see what blocked them and how to unblock the workflow.";return}$("detail").className="detail";$("detail").innerHTML=`<div class="chips"><span class="chip ${reasonClass(item.reasonCode)}">${esc(label(item.reasonCode))}</span><span class="chip">${esc(label(item.state))}</span><span class="chip">Version ${Number(item.version)||0}</span></div><h2>${esc(itemName(item))}</h2><p class="detail-lede">Obligation ${esc(item.obligationId||"—")}</p><div class="step"><span class="step-num">!</span><div><b>${esc(label(item.state||"Blocked"))}</b><span>${esc(item.evidence?.explanation||`Automation stopped at this step instead of guessing.`)}</span></div></div>${profileCards(item)}${fieldControls(item)}${evidenceHtml(item)}${auditHtml(item)}${actionButtons(item)}`;document.querySelectorAll(".profile").forEach(el=>el.onclick=()=>{document.querySelectorAll(".profile").forEach(x=>x.classList.remove("selected"));el.classList.add("selected")});document.querySelectorAll("[data-action]").forEach(el=>el.onclick=()=>runAction(el.dataset.action))}
function select(id){STATE.active=STATE.items.find(item=>String(item.id)===String(id))||null;renderQueue();renderDetail();reportHeight()}
function collectedChanges(){const changes={};document.querySelectorAll("[data-field]").forEach(el=>{let value;if(el.dataset.kind==="array")value=el.multiple?[...el.selectedOptions].map(option=>option.value):el.value.split(",").map(item=>item.trim()).filter(Boolean);else if(el.type==="number")value=el.value===""?null:Number(el.value);else value=el.value;if(value!==""&&value!==null&&(!Array.isArray(value)||value.length))changes[el.dataset.field]=value});const selected=document.querySelector(".profile.selected");if(selected)changes.candidateUserId=selected.dataset.profile;return changes}
async function runAction(action){if(STATE.busy||!STATE.active)return;const reason=$("audit-reason")?.value.trim();if(!reason)return toast("Add a short audit reason before saving.",true);if(action==="attach_resume")return attachResume(reason);if(action==="abandon"&&!confirm("Close this obligation without sending a post-call email?"))return;const changes=collectedChanges();if(action==="select_profile"&&!changes.candidateUserId)return toast("Select the correct Paraform profile first.",true);STATE.busy=true;document.querySelectorAll("[data-action]").forEach(button=>button.disabled=true);try{const result=await api("/api/post-call/review",{method:"POST",body:JSON.stringify({reviewId:STATE.active.id,version:STATE.active.version,action,changes,reason})});toast(result.resumedAt?"Saved and resumed from the next step.":"Review decision saved.");await load()}catch(error){if(error.status===409)showBanner("This item changed after you opened it, so your edit was not applied; refresh to see the current version.","warn");else toast(error.message,true)}finally{STATE.busy=false;document.querySelectorAll("[data-action]").forEach(button=>button.disabled=false)}}
function sourceUrl(item,body={}){const candidates=[body.authoritativeSourceUrl,body.authoritative_source_url,body.sourceUrl,body.authoritativeSource?.url,item?.evidence?.authoritativeSourceUrl,item?.evidence?.resumeSourceUrl,item?.evidence?.booking?.resumeUrl,item?.evidence?.candidate?.paraformUrl];return candidates.find(value=>typeof value==="string"&&/^https:\/\//.test(value))||null}
function showSourceBanner(message,url){showBanner(message,"warn");if(!url)return;const link=document.createElement("a");link.href=url;link.target="_blank";link.rel="noopener noreferrer";link.textContent=" Open the authoritative source ↗";$("banner").append(link)}
function resumeMime(file){if(["application/pdf","application/msword","application/vnd.openxmlformats-officedocument.wordprocessingml.document"].includes(file.type))return file.type;const name=file.name.toLowerCase();return name.endsWith(".pdf")?"application/pdf":name.endsWith(".docx")?"application/vnd.openxmlformats-officedocument.wordprocessingml.document":name.endsWith(".doc")?"application/msword":""}
function safeUploadTarget(value){const url=new URL(value);const host=url.hostname.toLowerCase();const privateHost=host==="localhost"||host.endsWith(".local")||/^127\.|^10\.|^192\.168\.|^169\.254\.|^172\.(?:1[6-9]|2\d|3[01])\./.test(host);if(url.protocol!=="https:"||url.username||url.password||url.hash||privateHost)throw new Error("The workflow service returned an unsafe résumé upload target.");return url}
async function attachResume(reason){const file=$("resume")?.files?.[0];if(!file)return toast("Choose a résumé file first.",true);if(file.size>20*1024*1024)return toast("That résumé is larger than 20 MB.",true);const mimeType=resumeMime(file);if(!mimeType)return toast("Choose a PDF, DOC, or DOCX résumé.",true);STATE.busy=true;try{const bytes=await file.arrayBuffer();const digest=await crypto.subtle.digest("SHA-256",bytes);const sha256=[...new Uint8Array(digest)].map(value=>value.toString(16).padStart(2,"0")).join("");const prepared=await api("/api/post-call/review",{method:"POST",body:JSON.stringify({action:"prepare_resume",reviewId:STATE.active.id,version:STATE.active.version,fileName:file.name,mimeType,sizeBytes:file.size,sha256})});const upload=prepared.upload||{},uploadUrl=safeUploadTarget(upload.url);if(String(upload.method||"PUT").toUpperCase()!=="PUT")throw new Error("The workflow service returned an unsafe résumé upload target.");const uploaded=await fetch(uploadUrl,{method:"PUT",headers:upload.headers||{"content-type":mimeType},body:bytes,credentials:"omit",redirect:"error",referrerPolicy:"no-referrer"});if(!uploaded.ok)throw new Error(`Résumé upload failed (${uploaded.status})`);const result=await api("/api/post-call/review",{method:"POST",body:JSON.stringify({reviewId:STATE.active.id,version:prepared.version??STATE.active.version,action:"attach_resume",changes:{fileToken:prepared.fileToken,sha256},reason})});toast(result.resumedAt?"Résumé verified and the workflow resumed.":"Résumé uploaded; verification is still settling.");await load()}catch(error){if(error.status===409)showBanner("This item changed while the résumé was uploading; nothing was attached, so refresh before retrying.","warn");else if(error.status===503)showSourceBanner("Secure résumé upload or scanning is unavailable; nothing was attached.",sourceUrl(STATE.active,error.body));else toast(error.message,true)}finally{STATE.busy=false}}
async function loadMore(){if(!STATE.nextCursor)return;$("load-more").disabled=true;try{const status=$("status").value;const body=await api(`/api/post-call/review?status=${encodeURIComponent(status)}&limit=50&cursor=${encodeURIComponent(STATE.nextCursor)}`);const seen=new Set(STATE.items.map(item=>String(item.id)));STATE.items.push(...(body.items||[]).filter(item=>!seen.has(String(item.id))));STATE.nextCursor=body.nextCursor||null;STATE.evidenceVersion=body.evidenceVersion??STATE.evidenceVersion;renderSummary();renderQueue();renderDetail()}catch(error){showBanner(error.message,"bad")}finally{$("load-more").disabled=false;reportHeight()}}
async function load(){clearBanner();$("fresh").textContent="Refreshing…";try{const status=$("status").value;const body=await api(`/api/post-call/review?status=${encodeURIComponent(status)}&limit=50`);STATE.items=body.items||[];STATE.actor=body.actor;STATE.nextCursor=body.nextCursor||null;STATE.evidenceVersion=body.evidenceVersion??null;const activeId=STATE.active?.id;STATE.active=STATE.items.find(item=>item.id===activeId)||STATE.items[0]||null;$("fresh").textContent=`Updated ${new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})} · ${label(body.actor?.role||"viewer")}${STATE.evidenceVersion!=null?` · evidence v${STATE.evidenceVersion}`:""}`;renderSummary();renderQueue();renderDetail();if(!canReviewWrite())showBanner("You have read-only Review access; resolution actions require the reviewer role.","warn");if(body.configured===false)showBanner("The post-call service is not configured on this dashboard yet.","warn")}catch(error){if(error.message!=="auth")showBanner(error.message,"bad")}reportHeight()}
function reportHeight(){if(window.parent!==window)window.parent.postMessage({type:"raydar-review-height",height:Math.max(document.body.scrollHeight,900)},location.origin)}
function showGate(){$("gate").style.display="flex";startGsi()}function startGsi(){if(!STATE.config?.clientId)return;(function wait(){if(!(window.google&&google.accounts?.id))return setTimeout(wait,150);google.accounts.id.initialize({client_id:STATE.config.clientId,callback:onCredential});google.accounts.id.renderButton($("gsi"),{theme:"filled_black",size:"large",text:"signin_with",shape:"pill"})})()}async function onCredential(response){try{await RaydarAuth.signIn(response.credential);$("gate").style.display="none";load()}catch{$("gate-error").textContent="Sign-in failed. Try again."}}
async function init(){STATE.config=await fetch("/api/auth/config",{cache:"no-store"}).then(r=>r.json()).catch(()=>({}));if(STATE.config.authRequired===false){$("gate").style.display="flex";$("gate-error").textContent="Google sign-in is not configured, so Review is fail-closed.";return}const session=await RaydarAuth.session().catch(()=>null);if(!session?.authenticated)return showGate();load()}
$("refresh").onclick=load;$("load-more").onclick=loadMore;$("search").oninput=renderQueue;$("status").onchange=load;window.addEventListener("resize",reportHeight);init();
</script>
</body>
