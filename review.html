<style>

  *{box-sizing:border-box}html,body{margin:0}body{background:var(--cream);color:var(--ink);font:14px "Inter Variable",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;padding:28px clamp(14px,3.5vw,46px) 80px}body.embed{padding-top:8px}.wrap{max-width:1240px;margin:0 auto}h1,h2,h3{font-family:"PP Grafier Display",Georgia,serif;font-weight:400}a{color:inherit}.eyebrow{font-size:10.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--orange)}header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:16px}h1{font-size:36px;line-height:1;margin:4px 0 0}.sub{color:var(--ink2);margin:8px 0 0;max-width:720px}body.embed h1,body.embed .sub{display:none}body.embed header{margin-bottom:9px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.button{appearance:none;border:0;border-radius:10px;padding:9px 13px;font:750 12px "Inter Variable";cursor:pointer}.button:disabled{opacity:.45;cursor:default}.button.primary{background:var(--orange);color:#fff}.button.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.button.warn{background:var(--warnbg);color:var(--warn)}.button.danger{background:var(--badbg);color:var(--bad)}.button.small{padding:6px 9px;font-size:11px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select,.field input,.field select,.field textarea{border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:inherit;padding:8px 10px}.toolbar input{min-width:230px;flex:1}.toolbar .fresh{margin-left:auto;color:var(--ink3);font-size:12px}.layout{display:grid;grid-template-columns:minmax(300px,.82fr) minmax(460px,1.35fr);gap:12px;align-items:start}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}.panel-head{padding:13px 15px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:10px}.panel-head h2{font-size:20px;margin:0}.panel-head span{font-size:11px;color:var(--ink3)}.panel-body{padding:9px 14px;border-top:1px solid var(--line)}.queue{max-height:calc(100vh - 210px);min-height:420px;overflow:auto;padding:7px}.qrow{display:block;width:100%;text-align:left;border:1px solid transparent;background:transparent;border-radius:11px;padding:11px;cursor:pointer;color:inherit}.qrow:hover{background:#FAF8F2}.qrow.on{background:#FFF3EB;border-color:#FFD0B2}.qtop,.meta,.chips{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.qtop{justify-content:space-between}.qname{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.qreason{font-size:12px;color:var(--ink2);margin-top:5px}.meta{font-size:10.5px;color:var(--ink3);margin-top:6px}.chip{display:inline-flex;align-items:center;border-radius:999px;padding:3px 7px;font-size:9.5px;letter-spacing:.035em;text-transform:uppercase;font-weight:800;background:var(--soft);color:var(--ink2)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.good{background:var(--goodbg);color:var(--good)}.chip.violet{background:var(--violetbg);color:var(--violet)}.detail-empty,.empty{padding:28px;text-align:center;color:var(--ink3)}.detail{padding:17px}.detail h2{font-size:26px;margin:0}.detail-lede{color:var(--ink2);margin:5px 0 13px}.step{display:flex;gap:9px;align-items:flex-start;background:#FAF8F2;border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin:12px 0}.step-num{width:22px;height:22px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:800;flex:none}.step b{display:block}.step span{font-size:12px;color:var(--ink2)}.section{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.section h3{font-size:18px;margin:0 0 9px}.profiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.profile{border:1px solid var(--line);border-radius:11px;background:#fff;padding:10px;text-align:left;cursor:pointer}.profile:disabled{cursor:default;opacity:.6}.profile:hover,.profile.selected{border-color:var(--orange);box-shadow:0 0 0 2px #FFE6D6}.profile b{display:block}.profile span{display:block;color:var(--ink3);font-size:11px;margin-top:3px;overflow-wrap:anywhere}.profile .call-attached{color:var(--good);font-weight:800}.profile .call-missing{color:var(--bad);font-weight:800}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.field label{display:block;color:var(--ink2);font-size:11px;font-weight:750;margin:0 0 4px}.field input,.field select,.field textarea{width:100%}.field textarea{min-height:78px;resize:vertical}.field.wide{grid-column:1/-1}.banner a{color:inherit;font-weight:800}.review-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:11px}.hint{font-size:11.5px;color:var(--ink3);margin-top:6px}.banner{display:none;border-radius:11px;padding:11px 13px;margin-bottom:11px}.banner.on{display:block}.banner.bad{background:var(--badbg);color:var(--bad)}.banner.warn{background:var(--warnbg);color:var(--warn)}.banner.good{background:var(--goodbg);color:var(--good)}.timeline{display:flex;flex-direction:column;gap:8px}.event{border-left:2px solid var(--line);padding-left:10px}.event b{font-size:12px}.event div{font-size:11px;color:var(--ink3)}.gate{position:fixed;inset:0;background:rgba(246,243,233,.97);display:none;align-items:flex-start;justify-content:center;flex-direction:column;gap:14px;z-index:40;padding:32px 20px 20px}.toast{position:fixed;right:20px;bottom:20px;max-width:420px;background:var(--ink);color:#fff;border-radius:11px;padding:11px 14px;box-shadow:var(--shadow);z-index:50}.toast[hidden]{display:none}.toast.bad{background:var(--bad)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .detail{padding:24px}.detail h2{font-size:30px}.detail-lede{margin:5px 0 22px}.unblock{border-top:1px solid var(--line);padding-top:22px}.unblock-kicker{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--orange)}.unblock h3{font:400 25px/1.15 "PP Grafier Display",Georgia,serif;margin:5px 0 7px}.unblock-copy{color:var(--ink2);margin:0 0 18px;max-width:620px}.control-block{margin-top:16px}.profiles{grid-template-columns:1fr;gap:9px}.profile{padding:13px;border-radius:12px}.profile b{font-size:14px}.profile span{font-size:11.5px;margin-top:4px}.profile .call-missing{color:var(--ink3);font-weight:650}.profile-title{display:flex;align-items:center;gap:8px}.profile-title b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.profile .paraform-link{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;flex:none;transition:transform .14s ease,box-shadow .14s ease}.profile .paraform-link:hover,.profile .paraform-link:focus-visible{transform:translateY(-1px);box-shadow:0 0 0 3px var(--violetbg);outline:0}.profile .paraform-link img{display:block;width:18px;height:18px;border-radius:50%}.fields{grid-template-columns:1fr;gap:12px}.field label{color:var(--ink);font-size:12px;font-weight:800;margin-bottom:6px}.field input,.field select,.field textarea{font-size:14px;padding:11px 12px}.field textarea{min-height:140px}.review-actions{gap:8px;margin-top:16px}.hint{margin-top:7px}.lookup{display:grid;gap:10px}.lookup-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.lookup-row input{min-width:0;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:inherit;padding:11px 12px}.lookup-row .button{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:82px}.lookup-or{display:flex;align-items:center;gap:9px;color:var(--ink3);font-size:11px}.lookup-or:before,.lookup-or:after{content:"";height:1px;background:var(--line);flex:1}.search-state{display:none;color:var(--ink2);font-size:11.5px;font-weight:700;margin-top:-3px}.search-state.on{display:block}.spinner{width:13px;height:13px;border:2px solid #D7D1C4;border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:850px){.layout{grid-template-columns:1fr}.queue{max-height:420px;min-height:0}.profiles,.fields{grid-template-columns:1fr}}
  @media(max-width:520px){body{padding:16px 10px 60px}header{align-items:stretch}.top-actions{width:100%}.toolbar input{min-width:100%}.detail{padding:13px}}
</style>

<body>
<div class="gate" id="gate"><div style="font:26px 'PP Grafier Display',serif">Sign in to review blocked people</div><div id="gsi"></div><div id="gate-error" style="color:var(--bad)"></div></div>
<main class="wrap">
  <header><div><div class="eyebrow">People</div><h1>Review</h1><p class="sub">Every blocked post-call follow-up in one queue, with the next action needed to continue.</p></div><div class="actions"><button class="button ghost" id="refresh">Refresh</button></div></header>
  <div class="banner" id="banner" role="status" aria-live="polite"></div>
  <div class="toolbar">
    <label class="sr-only" for="search">Search review queue</label><input id="search" type="search" placeholder="Search candidate, email, LinkedIn, call, or recruiter…" />
    <label class="sr-only" for="status">Review status</label><select id="status"><option value="open">Needs attention</option><option value="continuing">Continuing</option><option value="failed">Failed action</option><option value="resolved">Resolved</option><option value="all">All (90 days)</option></select>
    <label class="sr-only" for="category">Review category</label><select id="category"><option value="">All categories</option><option value="call">Call</option><option value="identity">Identity</option><option value="profile">Profile</option><option value="preferences">Preferences</option><option value="talent_network">Talent Network</option><option value="matching">Matching</option><option value="calibration">Calibration</option><option value="verdict">Role verdict</option><option value="recipient">Recipient</option><option value="delivery">Delivery</option></select>
    <label class="sr-only" for="call-type">Call type</label><select id="call-type"><option value="">All call types</option><option value="agent_general">Agent general</option><option value="human_general">Human general</option><option value="connector">Connector</option><option value="agent_role">Agent role interview</option><option value="human_role">Human role interview</option></select>
    <label class="sr-only" for="sla">SLA</label><select id="sla"><option value="">Any SLA</option><option value="overdue">Overdue</option><option value="due_soon">Due in one hour</option></select>
    <span class="fresh" id="fresh"></span>
  </div>
  <div class="layout">
    <section class="panel" aria-label="Review queue"><div class="panel-head"><h2>Needs attention</h2><span id="queue-count"></span></div><div class="queue" id="queue"></div><div class="panel-body" id="queue-more" hidden><button class="button ghost" id="load-more">Load more</button></div></section>
    <section class="panel" aria-label="Selected review item"><div id="detail" class="detail-empty">Select a person to see what blocked them and how to unblock the workflow.</div></section>
  </div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script>
const $=(id)=>document.getElementById(id);const params=new URLSearchParams(location.search);if(params.has("embed"))document.body.classList.add("embed");
const STATE={items:[],active:null,actor:null,config:null,busy:false,nextCursor:null,evidenceVersion:null,pollTimer:null,identityQuery:""};
const esc=(value)=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const label=(value)=>String(value||"").replace(/[_-]+/g," ").replace(/\b\w/g,c=>c.toUpperCase());
const when=(iso)=>{const ms=Date.now()-Date.parse(iso||"");if(!Number.isFinite(ms))return "Unknown time";const m=Math.max(0,Math.floor(ms/60000));return m<1?"Just now":m<60?`${m}m ago`:m<1440?`${Math.floor(m/60)}h ago`:`${Math.floor(m/1440)}d ago`};
function toast(message,bad=false){const el=$("toast");el.textContent=message;el.className="toast"+(bad?" bad":"");el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,5000)}
function showBanner(message,kind="warn"){const el=$("banner");el.className=`banner on ${kind}`;el.textContent=message}function clearBanner(){$("banner").className="banner"}
async function api(url,options={}){const response=await fetch(url,{credentials:"same-origin",cache:"no-store",...options,headers:{"content-type":"application/json",...(options.headers||{})}});const body=await response.json().catch(()=>({}));if(response.status===401||response.status===403){if(response.status===401)showGate();const error=new Error(body.detail||body.error||"Access denied");error.status=response.status;throw error}if(!response.ok||body.ok===false){const error=new Error(body.detail||body.error||"Request failed");error.status=response.status;error.body=body;throw error}return body}
function itemName(item){return item.candidate?.displayName||item.evidence?.candidate?.name||item.evidence?.booking?.fullName||"Candidate awaiting identity"}
function canReviewWrite(){return Boolean(STATE.actor?.capabilities?.reviewWrite)}function can(action){const c=STATE.actor?.capabilities||{};if(["select_profile","confirm_absent","abandon"].includes(action))return Boolean(c.reviewIdentityOverride);if(action==="approve_send")return Boolean(c.reviewSendApproval);return Boolean(c.reviewWrite)}
function reasonClass(code){return /conflict|ambiguous|unsafe|failed/i.test(code||"")?"bad":/delivery|gmail|matching|calibration/i.test(code||"")?"violet":"warn"}
function filtered(){return STATE.items}
function queueAvatar(item){const photo=item.candidate?.photoUrl;if(photo)return `<img src="${esc(photo)}" alt="" style="width:34px;height:34px;border-radius:50%;object-fit:cover;float:left;margin-right:9px" referrerpolicy="no-referrer">`;const initials=itemName(item).split(/\s+/).slice(0,2).map(v=>v[0]).join("").toUpperCase();return `<span style="width:34px;height:34px;border-radius:50%;display:grid;place-items:center;float:left;margin-right:9px;background:var(--violetbg);color:var(--violet);font-size:11px;font-weight:800">${esc(initials||"?")}</span>`}
function slaText(item){if(item.overdue)return "Overdue";if(!item.slaDueAt)return "No SLA";const min=Math.ceil((Date.parse(item.slaDueAt)-Date.now())/60000);return min<=60?`Due in ${Math.max(0,min)}m`:`Due in ${Math.ceil(min/60)}h`}
function renderQueue(){const items=filtered();$("queue-count").textContent=`${items.length} people${STATE.nextCursor?" · more available":""}`;$("queue").innerHTML=items.length?items.map(item=>`<button class="qrow ${STATE.active?.id===item.id?"on":""}" data-id="${esc(item.id)}" aria-pressed="${STATE.active?.id===item.id}">${queueAvatar(item)}<div class="qtop"><span class="qname">${esc(itemName(item))}</span><span class="chip ${item.overdue?"bad":reasonClass(item.category)}">${esc(label(item.status||"open"))}</span></div><div class="qreason">${esc(item.summary||"Review required")}</div><div class="meta"><span>${esc(label(item.call?.type||"call"))}</span><span>·</span><span>${esc(slaText(item))}</span></div><div style="clear:both"></div></button>`).join(""):`<div class="empty">No people need attention in this view.</div>`;$("queue-more").hidden=!STATE.nextCursor;document.querySelectorAll(".qrow").forEach(el=>el.onclick=()=>select(el.dataset.id))}
function technical(item){return item.technicalEvidence?.evidence||item.evidence||{}}
function profiles(item){const raw=item.identityCandidates||technical(item).profiles||technical(item).candidateProfiles||[];return (Array.isArray(raw)?raw:[]).sort((a,b)=>Number(b.currentCallAttached)-Number(a.currentCallAttached))}
function paraformProfileUrl(id){return `https://www.paraform.com/candidates?candidate_profile_id=${encodeURIComponent(String(id||""))}`}
function profileCards(item){
  const rows=profiles(item),identity=item.technicalEvidence?.blockedState==="review_identity";
  if(!identity)return "";
  if(!rows.length){const unavailable=item.identityCandidatesStatus==="unavailable";return `<div class="control-block"><p class="hint">${esc(item.identityCandidatesMessage||"No Paraform profile was found for this call.")}</p>${unavailable?'<button class="button ghost" id="reload-profiles">Try loading profiles again</button>':""}</div>`}
  const attached=rows.filter(profile=>profile.currentCallAttached===true),autoId=attached.length===1?(attached[0].candidateUserId||attached[0].id||attached[0].profileId):null,readonly=!canReviewWrite();
  return `<div class="control-block"><div class="profiles">${rows.map((profile,index)=>{const id=profile.candidateUserId||profile.id||profile.profileId,facts=[profile.email,profile.linkedinUrl,profile.talentNetwork?"Talent Network":null,profile.hasPreferences?"Preferences":null,profile.hasResume?"Résumé":null].filter(Boolean),attachment=profile.currentCallAttached===true,selected=String(id)===String(autoId),name=profile.name||`Profile ${index+1}`;return `<div class="profile ${selected?"selected":""}" data-profile="${esc(id)}" role="button" tabindex="${readonly?"-1":"0"}" aria-pressed="${selected}" aria-disabled="${readonly}"><div class="profile-title"><b>${esc(name)}</b><a class="paraform-link" href="${esc(paraformProfileUrl(id))}" target="_blank" rel="noopener noreferrer" aria-label="Open ${esc(name)} in Paraform" title="Open in Paraform"><img src="/assets/paraform-logo.svg" alt=""></a></div><span class="${attachment?"call-attached":"call-missing"}">${attachment?"This call is attached":"Call attachment not confirmed"}</span><span>${esc(facts.join(" · ")||id)}</span></div>`}).join("")}</div><p class="hint">Choose the profile that has this call attached.</p></div>`
}
function profileLookup(item){const identity=item.technicalEvidence?.blockedState==="review_identity",allowed=new Set(item.allowedActions||[]);if(!identity||!allowed.has("select_profile")||!can("select_profile"))return "";return `<div class="control-block lookup"><div class="lookup-row"><input id="profile-search" type="search" value="${esc(STATE.identityQuery)}" placeholder="Search Paraform by name, email, or LinkedIn" autocomplete="off"><button class="button ghost" id="search-profiles">Search</button></div><div class="search-state" id="profile-search-status" role="status" aria-live="polite"></div><div class="lookup-or">or</div><div class="lookup-row"><input id="profile-link" type="url" placeholder="Paste Paraform profile link" autocomplete="off"><button class="button primary" id="use-profile-link">Use link and continue</button></div></div>`}
const FIELD_OPTIONS={callOutcome:["completed_success","no_show","failed","incomplete","cancelled_or_rescheduled","ambiguous"],roleVerdict:["good","bad"],workplaces:["REMOTE","HYBRID","ON_SITE"],visaAuthorization:["NO_VISA_AUTHORIZATION_NEEDED","NEEDS_NEW_VISA_AUTHORIZATION"],fundingRounds:["PRE_SEED","SEED","SERIES_A","SERIES_B","SERIES_C","SERIES_D_PLUS","UNKNOWN"]};
const ARRAY_FIELDS=new Set(["locations","workplaces","fundingRounds"]),SYSTEM_FIELDS=new Set(["candidateUserId","confirmedAbsent","resumeToken"]);
const FIELD_COPY={fullName:"Full name",email:"Email address",phone:"Phone number",linkedinUrl:"LinkedIn profile",locations:"Location preferences",minimumBaseSalary:"Minimum base salary",workplaces:"Workplace preferences",fundingRounds:"Funding-stage preferences",visaAuthorization:"Visa requirement",callOutcome:"Call outcome",roleVerdict:"Interview result",callTranscript:"Call transcript"};
function normalizedFields(item){const fields=(item.allowedFields||[]).map(field=>typeof field==="string"?{name:field,label:FIELD_COPY[field]||label(field)}:field).filter(field=>field&&field.name&&!SYSTEM_FIELDS.has(field.name)),evidence=technical(item),requested=new Set([...(Array.isArray(evidence.missing)?evidence.missing:[]),...(Array.isArray(evidence.conflictingFields)?evidence.conflictingFields:[])]);const exact=fields.filter(field=>requested.has(field.name));return exact.length?exact:fields}
function currentValue(item,name){const evidence=technical(item);return evidence.current?.[name]??evidence.candidate?.[name]??evidence.booking?.[name]??""}
function fieldControls(item){const fields=normalizedFields(item);if(!fields.length)return "";const readonly=canReviewWrite()?"":"disabled";return `<div class="control-block"><div class="fields">${fields.map(field=>{const name=field.name,raw=currentValue(item,name),values=Array.isArray(raw)?raw.map(String):String(raw||"").split(",").map(value=>value.trim()).filter(Boolean),options=field.options||FIELD_OPTIONS[name],title=field.label||FIELD_COPY[name]||label(name);if(options){const multiple=ARRAY_FIELDS.has(name);return `<div class="field"><label for="field-${esc(name)}">${esc(title)}</label><select id="field-${esc(name)}" data-field="${esc(name)}" ${multiple?'data-kind="array" multiple size="4"':""} ${readonly}>${multiple?"":'<option value="">Choose…</option>'}${options.map(option=>`<option value="${esc(option)}" ${values.includes(String(option))?"selected":""}>${esc(label(option))}</option>`).join("")}</select>${multiple?'<p class="hint">Select every option that applies.</p>':""}</div>`}const list=ARRAY_FIELDS.has(name),transcript=/transcript/i.test(name);return `<div class="field"><label for="field-${esc(name)}">${esc(title)}</label>${transcript?`<textarea id="field-${esc(name)}" data-field="${esc(name)}" placeholder="Paste the transcript with speaker names" ${readonly}>${esc(raw)}</textarea>`:`<input id="field-${esc(name)}" data-field="${esc(name)}" ${list?'data-kind="array"':''} ${name==="minimumBaseSalary"?'type="number" min="1" step="1000"':name==="linkedinUrl"?'type="url" placeholder="https://www.linkedin.com/in/…"':'type="text"'} value="${esc(Array.isArray(raw)?raw.join(", "):raw)}" autocomplete="off" ${readonly} />`}${list?'<p class="hint">Separate multiple values with commas.</p>':""}</div>`}).join("")}</div></div>`}
function actionButtons(item){if(!canReviewWrite())return "";const allowed=new Set(item.allowedActions||[]),sendApproval=technical(item).reasonCode==="send_approval_required",identityChoice=item.technicalEvidence?.blockedState==="review_identity"&&allowed.has("select_profile"),uncertainIdentity=identityChoice&&technical(item).reasonCode==="external_effect_outcome_unknown",rows=profiles(item),identityUnavailable=identityChoice&&item.identityCandidatesStatus==="unavailable",buttons=[];if(allowed.has("select_profile")&&rows.length&&can("select_profile"))buttons.push(["select_profile","Use this profile and continue","primary"]);if(allowed.has("confirm_absent")&&can("confirm_absent")&&!identityUnavailable&&!uncertainIdentity)buttons.push(["confirm_absent",rows.length?"None of these profiles":"No Paraform profile exists","warn"]);if(allowed.has("set_field")&&normalizedFields(item).length)buttons.push(["set_field","Save and continue","primary"]);if(allowed.has("set_call_outcome"))buttons.push(["set_call_outcome","Save and continue","primary"]);if(allowed.has("set_role_verdict"))buttons.push(["set_role_verdict","Save and continue","primary"]);if(allowed.has("retry")&&!identityChoice)buttons.push(["retry","Try again","primary"]);if(allowed.has("resume")&&!identityChoice&&(!sendApproval||can("approve_send")))buttons.push(["resume",sendApproval?"Approve and send":"Continue","primary"]);return `<div class="control-block">${allowed.has("attach_resume")?`<div class="field"><label for="resume">Résumé</label><input id="resume" type="file" accept=".pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" /><p class="hint">PDF, DOC, or DOCX up to 25 MB.</p></div>`:""}<div class="review-actions">${buttons.map(([action,text,kind])=>`<button class="button ${kind}" data-action="${action}">${text}</button>`).join("")}${allowed.has("attach_resume")?`<button class="button primary" data-action="attach_resume">Upload résumé and continue</button>`:""}</div></div>`}
function renderDetail(){const item=STATE.active;if(!item){$("detail").className="detail-empty";$("detail").textContent="Select a person to see what needs to be fixed.";return}const c=item.candidate||{},call=item.call||{},continuing=["validating","continuing"].includes(item.status),help=continuing?"Your change was saved; this person will disappear when the workflow advances, or return with the next thing needed.":item.nextStep;$("detail").className="detail";$("detail").innerHTML=`<h2>${esc(itemName(item))}</h2><p class="detail-lede">${esc([c.email,call.roleTitle,call.company].filter(Boolean).join(" · ")||"Post-call follow-up")}</p><div class="unblock"><div class="unblock-kicker">${continuing?"In progress":"What needs to happen"}</div><h3>${esc(continuing?"The workflow is continuing":item.summary||"Review required")}</h3>${help?`<p class="unblock-copy">${esc(help)}</p>`:""}${continuing?"":profileLookup(item)+profileCards(item)+fieldControls(item)+actionButtons(item)}</div>`;document.querySelectorAll(".profile").forEach(el=>{const choose=()=>{if(el.getAttribute("aria-disabled")==="true")return;document.querySelectorAll(".profile").forEach(x=>{x.classList.remove("selected");x.setAttribute("aria-pressed","false")});el.classList.add("selected");el.setAttribute("aria-pressed","true")};el.onclick=event=>{if(event.target.closest(".paraform-link"))return;choose()};el.onkeydown=event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();choose()}}});document.querySelectorAll("[data-action]").forEach(el=>el.onclick=()=>runAction(el.dataset.action));const reload=$("reload-profiles");if(reload)reload.onclick=()=>select(item.id);const search=$("search-profiles"),searchInput=$("profile-search"),link=$("use-profile-link");if(search)search.onclick=searchProfiles;if(searchInput)searchInput.onkeydown=event=>{if(event.key==="Enter"){event.preventDefault();searchProfiles()}};if(link)link.onclick=useProfileLink}
async function select(id){STATE.identityQuery="";STATE.active=STATE.items.find(item=>String(item.id)===String(id))||null;renderQueue();renderDetail();reportHeight();if(!STATE.active)return;try{const body=await api(`/api/post-call/review?id=${encodeURIComponent(id)}`);if(body.item){STATE.active=body.item;const index=STATE.items.findIndex(item=>String(item.id)===String(id));if(index>=0)STATE.items[index]=body.item;renderQueue();renderDetail();reportHeight()}}catch(error){showBanner(error.message,"bad")}}
function setProfileSearchBusy(busy){const button=$("search-profiles"),input=$("profile-search"),status=$("profile-search-status");if(button){button.disabled=busy;button.innerHTML=busy?'<span class="spinner" aria-hidden="true"></span>Searching…':"Search"}if(input){input.disabled=busy;input.setAttribute("aria-busy",String(busy))}if(status){status.textContent=busy?"Searching Paraform…":"";status.classList.toggle("on",busy)}}
async function searchProfiles(){if(STATE.busy||!STATE.active)return;const query=$("profile-search")?.value.trim()||"";if(query.length<2)return toast("Enter at least two characters.",true);STATE.identityQuery=query;STATE.busy=true;setProfileSearchBusy(true);try{const body=await api(`/api/post-call/review?id=${encodeURIComponent(STATE.active.id)}&identitySearch=${encodeURIComponent(query)}`);if(body.item){STATE.active=body.item;renderDetail();reportHeight()}}catch(error){toast(error.message,true)}finally{STATE.busy=false;setProfileSearchBusy(false)}}
function profileIdFromLink(value){try{const url=new URL(String(value||"").trim());if(url.protocol!=="https:"||!["paraform.com","www.paraform.com"].includes(url.hostname.toLowerCase())||url.pathname!=="/candidates")return null;const id=(url.searchParams.get("candidate_profile_id")||url.searchParams.get("id")||"").trim();return /^[a-zA-Z0-9_-]{3,160}$/.test(id)?id:null}catch{return null}}
function useProfileLink(){const candidateUserId=profileIdFromLink($("profile-link")?.value);if(!candidateUserId)return toast("Paste a valid Paraform candidate profile link.",true);runAction("select_profile",{candidateUserId})}
function collectedChanges(){const changes={};document.querySelectorAll("[data-field]").forEach(el=>{let value;if(el.dataset.kind==="array")value=el.multiple?[...el.selectedOptions].map(option=>option.value):el.value.split(",").map(item=>item.trim()).filter(Boolean);else if(el.type==="number")value=el.value===""?null:Number(el.value);else value=el.value;if(value!==""&&value!==null&&(!Array.isArray(value)||value.length))changes[el.dataset.field]=value});const selected=document.querySelector(".profile.selected");if(selected)changes.candidateUserId=selected.dataset.profile;return changes}
async function runAction(action,overrideChanges=null){if(STATE.busy||!STATE.active)return;const reason=`Review action: ${label(action)}`;if(action==="attach_resume")return attachResume(reason);if(action==="abandon"&&!confirm("Close this obligation without sending a post-call email?"))return;const approveSend=action==="resume"&&technical(STATE.active).reasonCode==="send_approval_required";if(approveSend&&!confirm("Approve and send this candidate's prepared post-call email now?"))return;const changes=overrideChanges||collectedChanges();if(action==="select_profile"&&!changes.candidateUserId)return toast("Select the correct Paraform profile first.",true);STATE.busy=true;document.querySelectorAll("[data-action],#search-profiles,#use-profile-link").forEach(button=>button.disabled=true);try{const result=await api("/api/post-call/review",{method:"POST",body:JSON.stringify({reviewId:STATE.active.id,version:STATE.active.version,action,changes,reason,...(approveSend?{approveSend:true}:{})})});toast(approveSend?"Email approved; Mailroom is processing this exact follow-up.":result.resumedAt?"Saved; the same workflow is continuing now.":"Review decision saved.");await load();if(result.resumedAt)startContinuingPoll(result.reviewId)}catch(error){if(error.status===409)showBanner("This person changed after you opened them, so your edit was not applied; refresh to see the current version.","warn");else toast(error.message,true)}finally{STATE.busy=false;document.querySelectorAll("[data-action],#search-profiles,#use-profile-link").forEach(button=>button.disabled=false)}}
function sourceUrl(item,body={}){const evidence=technical(item);const candidates=[body.authoritativeSourceUrl,body.authoritative_source_url,body.sourceUrl,body.authoritativeSource?.url,evidence.authoritativeSourceUrl,evidence.resumeSourceUrl,evidence.booking?.resumeUrl,evidence.candidate?.paraformUrl];return candidates.find(value=>typeof value==="string"&&/^https:\/\//.test(value))||null}
function showSourceBanner(message,url){showBanner(message,"warn");if(!url)return;const link=document.createElement("a");link.href=url;link.target="_blank";link.rel="noopener noreferrer";link.textContent=" Open the authoritative source ↗";$("banner").append(link)}
function resumeMime(file){if(["application/pdf","application/msword","application/vnd.openxmlformats-officedocument.wordprocessingml.document"].includes(file.type))return file.type;const name=file.name.toLowerCase();return name.endsWith(".pdf")?"application/pdf":name.endsWith(".docx")?"application/vnd.openxmlformats-officedocument.wordprocessingml.document":name.endsWith(".doc")?"application/msword":""}
function safeUploadTarget(value){const url=new URL(value);const host=url.hostname.toLowerCase();const privateHost=host==="localhost"||host.endsWith(".local")||/^127\.|^10\.|^192\.168\.|^169\.254\.|^172\.(?:1[6-9]|2\d|3[01])\./.test(host);if(url.protocol!=="https:"||url.username||url.password||url.hash||privateHost)throw new Error("The workflow service returned an unsafe résumé upload target.");return url}
async function attachResume(reason){const file=$("resume")?.files?.[0];if(!file)return toast("Choose a résumé file first.",true);if(file.size>25*1024*1024)return toast("That résumé is larger than 25 MB.",true);const mimeType=resumeMime(file);if(!mimeType)return toast("Choose a PDF, DOC, or DOCX résumé.",true);STATE.busy=true;try{const bytes=await file.arrayBuffer();const digest=await crypto.subtle.digest("SHA-256",bytes);const sha256=[...new Uint8Array(digest)].map(value=>value.toString(16).padStart(2,"0")).join("");const prepared=await api("/api/post-call/review",{method:"POST",body:JSON.stringify({action:"prepare_resume",reviewId:STATE.active.id,version:STATE.active.version,fileName:file.name,mimeType,sizeBytes:file.size,sha256})});const upload=prepared.upload||{},uploadUrl=safeUploadTarget(upload.url);if(String(upload.method||"PUT").toUpperCase()!=="PUT")throw new Error("The workflow service returned an unsafe résumé upload target.");const uploaded=await fetch(uploadUrl,{method:"PUT",headers:upload.headers||{"content-type":mimeType},body:bytes,credentials:"omit",redirect:"error",referrerPolicy:"no-referrer"});if(!uploaded.ok)throw new Error(`Résumé upload failed (${uploaded.status})`);const result=await api("/api/post-call/review",{method:"POST",body:JSON.stringify({reviewId:STATE.active.id,version:prepared.version??STATE.active.version,action:"attach_resume",changes:{fileToken:prepared.fileToken,sha256},reason})});toast(result.resumedAt?"Résumé verified and the workflow resumed.":"Résumé uploaded; verification is still settling.");await load()}catch(error){if(error.status===409)showBanner("This item changed while the résumé was uploading; nothing was attached, so refresh before retrying.","warn");else if(error.status===503)showSourceBanner("Secure résumé upload or scanning is unavailable; nothing was attached.",sourceUrl(STATE.active,error.body));else toast(error.message,true)}finally{STATE.busy=false}}
function query(cursor=null){const p=new URLSearchParams({status:$("status").value,limit:"50"});for(const [key,id] of [["category","category"],["callType","call-type"],["sla","sla"],["search","search"]]){const value=$(id).value.trim();if(value)p.set(key,value)}if(cursor)p.set("cursor",cursor);return p}
async function loadMore(){if(!STATE.nextCursor)return;$("load-more").disabled=true;try{const body=await api(`/api/post-call/review?${query(STATE.nextCursor)}`);const seen=new Set(STATE.items.map(item=>String(item.id)));STATE.items.push(...(body.items||[]).filter(item=>!seen.has(String(item.id))));STATE.nextCursor=body.nextCursor||null;STATE.evidenceVersion=body.evidenceVersion??STATE.evidenceVersion;renderQueue();renderDetail()}catch(error){showBanner(error.message,"bad")}finally{$("load-more").disabled=false;reportHeight()}}
function startContinuingPoll(reviewId){clearTimeout(STATE.pollTimer);let remaining=20;const poll=async()=>{if(remaining--<=0)return showBanner("This workflow is still continuing; the person remains safely in Review until it advances.","warn");try{const body=await api(`/api/post-call/review?id=${encodeURIComponent(reviewId)}`);const item=body.item;if(item&&["continuing","validating"].includes(item.status)){STATE.active=item;renderDetail();STATE.pollTimer=setTimeout(poll,3000);return}await load()}catch{STATE.pollTimer=setTimeout(poll,3000)}};STATE.pollTimer=setTimeout(poll,1500)}
async function load(){clearBanner();$("fresh").textContent="Refreshing…";try{const body=await api(`/api/post-call/review?${query()}`);STATE.items=body.items||[];STATE.actor=body.actor;STATE.nextCursor=body.nextCursor||null;STATE.evidenceVersion=body.evidenceVersion??null;const activeId=STATE.active?.id;STATE.active=STATE.items.find(item=>item.id===activeId)||STATE.items[0]||null;$("fresh").textContent=`Updated ${new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})} · ${label(body.actor?.role||"viewer")}${STATE.evidenceVersion!=null?` · evidence v${STATE.evidenceVersion}`:""}`;renderQueue();renderDetail();if(!canReviewWrite())showBanner("You have read-only Review access; resolution actions require the reviewer role.","warn");if(body.configured===false)showBanner("The post-call service is not configured on this dashboard yet.","warn")}catch(error){if(error.message!=="auth")showBanner(error.message,"bad")}reportHeight()}
function reportHeight(){if(window.parent!==window)window.parent.postMessage({type:"raydar-review-height",height:Math.max(document.body.scrollHeight,900)},location.origin)}
function showGate(){$("gate").style.display="flex";startGsi()}function startGsi(){if(!STATE.config?.clientId)return;(function wait(){if(!(window.google&&google.accounts?.id))return setTimeout(wait,150);google.accounts.id.initialize({client_id:STATE.config.clientId,callback:onCredential});google.accounts.id.renderButton($("gsi"),{theme:"filled_black",size:"large",text:"signin_with",shape:"pill"})})()}async function onCredential(response){try{await RaydarAuth.signIn(response.credential);$("gate").style.display="none";load()}catch{$("gate-error").textContent="Sign-in failed. Try again."}}
async function init(){STATE.config=await fetch("/api/auth/config",{cache:"no-store"}).then(r=>r.json()).catch(()=>({}));if(STATE.config.authRequired===false){$("gate").style.display="flex";$("gate-error").textContent="Google sign-in is not configured, so Review is fail-closed.";return}const session=await RaydarAuth.session().catch(()=>null);if(!session?.authenticated)return showGate();load()}
let searchTimer;$("refresh").onclick=load;$("load-more").onclick=loadMore;$("search").oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(load,250)};for(const id of ["status","category","call-type","sla"])$(id).onchange=load;window.addEventListener("resize",reportHeight);init();
</script>
