<style>
  :root{--cream:#f6f3e9;--paper:#fff;--ink:#181510;--muted:#777166;--line:#e7dfd1;--violet:#7463e7;--orange:#ff5e00;--shadow:0 12px 36px -28px #342c22}

  .list{border-right:1px solid var(--line);min-width:0;overflow:hidden}.listbar{height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 14px}.listbar strong{font:600 17px "PP Grafier Display",Georgia,serif}.ghost{border:1px solid var(--line);background:white;border-radius:9px;padding:7px 9px;color:#5f594f;white-space:nowrap}.listbar .spacer{margin-left:auto}.row{width:100%;min-height:92px;border:0;border-bottom:1px solid #f0ece3;background:white;text-align:left;padding:11px 13px;display:grid;grid-template-columns:20px 18px minmax(0,1fr) auto;align-items:start;gap:8px;cursor:pointer;overflow:hidden}.row>span:nth-child(3){display:block;min-width:0;overflow:hidden}.row:hover,.row.active{background:#fcfaf5}.row.active{box-shadow:inset 3px 0 var(--orange)}.pick{width:18px;height:18px;padding:0;border:1px solid #cfc7b9;border-radius:5px;background:white;color:white}.pick.on{background:var(--violet);border-color:var(--violet)}.star{border:0;background:transparent;padding:0;color:#c7bda9;font-size:16px}.row.unread .who,.row.unread .subject{font-weight:800}.who,.subject,.snippet{display:block;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.who{font-weight:650}.subject{margin-top:2px}.snippet{color:var(--muted);margin-top:2px}.time{font-size:11px;color:var(--muted);white-space:nowrap;padding-top:1px}.badge{display:inline-flex;max-width:100%;margin-top:6px;background:#eee9ff;color:#5a49c7;border-radius:999px;padding:2px 7px;font-size:10px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .reader{min-width:0;overflow:auto}.readbar{min-height:54px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:7px;padding:8px 16px;overflow-x:auto}.readbar .push{margin-left:auto}.message{padding:24px 26px;min-width:0}.message h2{font:600 clamp(22px,2.2vw,30px)/1.16 "PP Grafier Display",Georgia,serif;margin:0 0 17px;overflow-wrap:anywhere}.meta{display:flex;gap:11px;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px;min-width:0}.meta>span:last-child{display:block;min-width:0}.avatar{width:36px;height:36px;flex:0 0 36px;border-radius:50%;display:grid;place-items:center;background:#e9e5ff;color:#5543c3;font-weight:800}.meta strong,.meta small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta small{color:var(--muted)}.body{max-width:72ch;font-size:14px;line-height:1.7;padding:20px 0;overflow-wrap:anywhere}.body p{margin:0 0 1em}.body img{max-width:100%;height:auto}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}.primary{border:0;background:var(--ink);color:white;border-radius:10px;padding:10px 16px;font-weight:800}.loadmore{display:block;margin:14px auto}
  .embedded body{background:transparent;overflow:hidden}.embedded .app{max-width:none;height:100vh;padding:14px 16px;display:flex;flex-direction:column;overflow:hidden}.embedded .top{flex:0 0 auto}.embedded .layout{flex:1;min-height:0}.embedded #conversationList{height:calc(100% - 54px);overflow:auto}.embedded .rail,.embedded .reader{min-height:0}
  .back{display:none}@media(max-width:1050px){.layout{grid-template-columns:190px minmax(330px,1fr)}.reader{display:none}body.reading .list{display:none}body.reading .reader{display:block}.back{display:inline-block}}
  @media(max-width:720px){.app{padding:10px}.top{flex-wrap:wrap}.title{min-width:0}.status{margin-left:auto}.search{order:3;flex-basis:100%}.layout{display:block;min-height:0}.rail{display:flex;overflow:auto;border:0;border-bottom:1px solid var(--line);gap:5px}.rail h2,.rail .mailbox{display:none}.compose{width:auto;white-space:nowrap;margin:0}.nav{width:auto;white-space:nowrap}.list{border:0}.row{padding:13px 12px}.readbar{overflow:auto}.message{padding:18px 14px}}
  dialog{width:min(680px,calc(100% - 24px));border:1px solid var(--line);border-radius:18px;padding:0;box-shadow:0 24px 90px -32px #17130d}dialog::backdrop{background:rgba(24,21,16,.35)}.compose-head,.compose-foot{display:flex;align-items:center;gap:9px;padding:14px 17px;border-bottom:1px solid var(--line)}.compose-head h2{font:600 20px "PP Grafier Display",Georgia,serif;margin:0}.compose-head button{margin-left:auto}.compose-body{display:grid;gap:10px;padding:15px 17px}.field{display:grid;grid-template-columns:54px 1fr;align-items:center;gap:8px}.field label{color:var(--muted);font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px;background:white}.field textarea{min-height:190px;resize:vertical}.compose-foot{border-top:1px solid var(--line);border-bottom:0}.compose-foot .send{margin-left:auto}.compose-note{color:var(--muted);font-size:11px}.toast{position:fixed;right:20px;bottom:20px;z-index:20;background:var(--ink);color:white;border-radius:12px;padding:11px 14px;box-shadow:0 12px 32px -14px #000;display:flex;align-items:center;gap:12px}.toast button{color:white;border:1px solid #5f5a53;background:transparent;border-radius:8px;padding:5px 8px}.gate{position:fixed;inset:0;display:grid;place-items:center;background:var(--cream);z-index:40}.gatebox{background:white;border:1px solid var(--line);border-radius:18px;padding:30px;text-align:center;max-width:410px}.gatebox h2{font:600 24px "PP Grafier Display",Georgia,serif;margin:0 0 8px}.gatebox p{color:var(--muted)}.error{color:#9d2e2e}.empty{padding:54px 20px;text-align:center;color:var(--muted)}.reader-message{border-bottom:1px solid var(--line);padding:17px 0}.attachments{display:flex;gap:8px;flex-wrap:wrap}.attachment{border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--ink);text-decoration:none}.stale{background:#fff3df;border:1px solid #ead3aa;padding:9px 11px;border-radius:10px;color:#76501e;margin-bottom:12px}.report{margin-top:15px;font-size:11px;color:var(--muted);text-align:center}.report button{border:0;background:transparent;color:inherit;text-decoration:underline}
  details.reader-message summary{cursor:pointer;list-style:none}details.reader-message summary::-webkit-details-marker{display:none}
</style>

<body>
<div class="gate hidden" id="gate"><div class="gatebox"><h2>Master Inbox</h2><p>Sign in with your Raydar Google account to use connected mailboxes.</p><div id="gsi"></div><p class="error" id="gateError"></p></div></div>
<main class="app">
  <header class="top">
    <div class="title"><h1>Master Inbox</h1><p>All Raydar mail, in one place</p></div>
    <input class="search" id="search" aria-label="Search all mail" placeholder="Search mail, people, attachments…" />
    <div class="status" id="status">Loading shared store…</div>
  </header>
  <section class="layout" aria-label="Master Inbox preview">
    <nav class="rail" aria-label="Mailbox views">
      <button class="compose" id="compose">＋ Compose</button>
      <h2>Mail</h2>
      <button class="nav active" data-folder="all">All inboxes <span id="allCount">—</span></button><button class="nav" data-folder="inbox">Inbox <span id="inboxCount">—</span></button><button class="nav" data-folder="starred">Starred</button><button class="nav" data-folder="snoozed">Snoozed</button><button class="nav" data-folder="sent">Sent</button><button class="nav" data-folder="drafts">Drafts</button><button class="nav" data-folder="spam">Spam</button><button class="nav" data-folder="trash">Trash</button><button class="nav" data-folder="all-mail">All Mail</button>
      <h2>Mailboxes</h2>
      <div id="mailboxes"><button class="nav mailbox" style="--dot:#ff5e00">david@raydar.xyz</button><button class="nav mailbox" style="--dot:#7463e7">david@raydargroup.com</button><button class="nav mailbox" style="--dot:#1a9566">noah@raydar.xyz</button><button class="nav mailbox" style="--dot:#d38b2d">resume@metawork.us</button></div><div class="report"><button id="reportProblem">Report problem</button></div>
    </nav>
    <section class="list" aria-label="Conversations">
      <div class="listbar"><strong id="viewTitle">All inboxes</strong><span class="spacer"></span><button class="ghost hidden" id="bulkRead">Read</button><button class="ghost hidden" id="bulkArchive">Archive</button><button class="ghost" id="refresh" aria-label="Refresh shared store">↻</button></div>
      <div id="conversationList"><button class="row unread active"><span class="star">☆</span><span><span class="who">Maya Chen</span><span class="subject">Re: Head of Growth opportunity</span><span class="snippet">Tuesday works perfectly — looking forward to meeting the team.</span><span class="badge">david@raydar.xyz</span></span><time class="time">12:42 PM</time></button></div><button class="ghost loadmore hidden" id="loadMore">Load more</button>
    </section>
    <article class="reader">
      <div class="readbar"><button class="ghost back" id="backList">Back</button><button class="ghost" id="archiveAction" data-action="archive">Archive</button><button class="ghost" data-organize="snooze">Snooze</button><button class="ghost" data-organize="tag">Tag</button><button class="ghost" data-action="spam">Spam</button><button class="ghost" data-action="trash">Trash</button><button class="ghost" id="exportMessage">Download</button><button class="ghost" id="print" aria-label="Print">Print</button></div>
      <div class="message" id="reader"><h2>Choose a conversation</h2><div class="body">Select an email to read the complete proven thread.</div></div>
    </article>
  </section>
</main>
<dialog id="composer"><form method="dialog" id="composeForm"><div class="compose-head"><h2>New message</h2><button class="ghost" value="cancel" formnovalidate aria-label="Close">×</button></div><div class="compose-body"><div class="field"><label for="from">From</label><select id="from" required></select></div><div class="field"><label for="to">To</label><input id="to" type="text" required /></div><div class="field"><label for="cc">Cc</label><input id="cc" type="text" /></div><div class="field"><label for="bcc">Bcc</label><input id="bcc" type="text" /></div><div class="field"><label for="subject">Subject</label><input id="subject" required /></div><div class="field"><label for="body">Message</label><textarea id="body" required></textarea></div><div class="field"><label for="files">Files</label><input id="files" type="file" multiple /></div><div class="field"><label for="schedule" id="scheduleLabel">Send at</label><input id="schedule" type="datetime-local" /></div></div><div class="compose-foot"><span class="compose-note" id="draftStatus">Saved only in Raydar</span><button class="ghost" id="saveDraft" type="button">Save draft</button><button class="primary send" id="send" type="button">Send</button></div></form></dialog>
<div class="toast hidden" id="toast"><span id="toastText"></span><button id="toastAction" class="hidden"></button></div>
<script>
const $=id=>document.getElementById(id);
const DEMO=location.hostname==="127.0.0.1"||location.hostname==="localhost"||new URLSearchParams(location.search).get("demo")==="1";
const COLORS=["#ff5e00","#7463e7","#1a9566","#d38b2d","#2f76c5","#c24b8c"];
const DEMO_ROWS=[
 {id:"11111111-1111-4111-8111-111111111111",subject:"Re: Head of Growth opportunity",participant_text:"Maya Chen <maya@example.com>",snippet:"Tuesday works perfectly — looking forward to meeting the team.",newest_at:new Date().toISOString(),message_count:3,mailbox_ids:["david-raydar-xyz"],unread:true,starred:false,has_attachment:false,action_target:{mailboxId:"david-raydar-xyz",providerMessageId:"demo-message"},action_targets:[{mailboxId:"david-raydar-xyz",providerMessageId:"demo-message"}]},
 {id:"22222222-2222-4222-8222-222222222222",subject:"Interview updated: Marcus Lee",participant_text:"Google Calendar",snippet:"The event time was changed to Thursday at 2:00 PM.",newest_at:new Date(Date.now()-84e5).toISOString(),message_count:1,mailbox_ids:["noah-raydar-xyz"],unread:true,starred:false,has_attachment:false},
 {id:"33333333-3333-4333-8333-333333333333",subject:"Resume and portfolio",participant_text:"Daniel Rivera <daniel@example.com>",snippet:"I’ve attached the latest version along with a few recent projects.",newest_at:new Date(Date.now()-864e5).toISOString(),message_count:2,mailbox_ids:["resume-meta-work"],unread:false,starred:true,has_attachment:true},
 {id:"44444444-4444-4444-8444-444444444444",subject:"Candidate handoff",participant_text:"Kyra Patel",snippet:"The notes and compensation expectations are all in the thread.",newest_at:new Date(Date.now()-1728e5).toISOString(),message_count:4,mailbox_ids:["david-raydargroup-com"],unread:false,starred:false,has_attachment:false}
];
const DEMO_BOXES=[
 {id:"david-raydar-xyz",principal:"david@raydar.xyz",visible_addresses:["david@raydar.xyz"],unread_count:12,inbox_count:39,status:"active",capabilities:{send:true},default_signature:"David\nRaydar"},
 {id:"david-raydargroup-com",principal:"david@raydargroup.com",visible_addresses:["david@raydargroup.com"],unread_count:4,inbox_count:18,status:"active",capabilities:{send:true},default_signature:"David\nRaydar Group"},
 {id:"noah-raydar-xyz",principal:"noah@raydar.xyz",visible_addresses:["noah@raydar.xyz"],unread_count:7,inbox_count:22,status:"active",capabilities:{send:true},default_signature:"Noah\nRaydar"},
 {id:"resume-meta-work",principal:"resume@meta.work",visible_addresses:["resume@metawork.us"],unread_count:1,inbox_count:125811,status:"active",capabilities:{send:true},default_signature:"Raydar Recruiting"}
];
const STATE={rows:[],mailboxes:[],folder:"all",mailbox:"",query:"",cursor:null,hasMore:false,selected:null,chosen:new Set(),thread:null,draft:null,send:null,loading:false,composeSignature:"",composeMode:"new",listScroll:0};
const esc=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[char]);
const displayText=value=>String(value??"").replace(/&(#x[0-9a-f]+|#\d+|amp|lt|gt|quot|apos);/gi,(entity,code)=>{const named={amp:"&",lt:"<",gt:">",quot:'"',apos:"'"};if(named[code.toLowerCase()])return named[code.toLowerCase()];const point=code[1].toLowerCase()==="x"?parseInt(code.slice(2),16):parseInt(code.slice(1),10);try{return Number.isFinite(point)?String.fromCodePoint(point):entity;}catch{return entity;}});
const mailbox=id=>STATE.mailboxes.find(item=>item.id===id);
const mailboxLabel=id=>mailbox(id)?.visible_addresses?.[0]||mailbox(id)?.principal||id;
function contacts(value){if(Array.isArray(value))return value;if(value&&typeof value==="object")return [value];const raw=String(value||"").trim();try{const parsed=JSON.parse(raw);if(Array.isArray(parsed))return parsed;if(parsed&&typeof parsed==="object")return [parsed];}catch{}const rows=[];for(const match of raw.matchAll(/\{[^{}]*\}/g)){try{const row=JSON.parse(match[0]);if(row&&(row.name||row.address))rows.push(row);}catch{}}return rows;}
function firstContact(value){return contacts(value)[0]||null;}
const name=value=>{const contact=firstContact(value);return displayText(contact?.name||contact?.address||value||"Unknown sender").replace(/<[^>]+>/g,"").trim();};
const time=value=>{const date=new Date(value);const now=new Date();if(date.toDateString()===now.toDateString())return date.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"});return date.toLocaleDateString([],{month:"short",day:"numeric"});};
function toast(text,action,handler){$("toastText").textContent=text;$("toast").classList.remove("hidden");$("toastAction").classList.toggle("hidden",!action);$("toastAction").textContent=action||"";$("toastAction").onclick=handler||null;clearTimeout(window.__toast);window.__toast=setTimeout(()=>$("toast").classList.add("hidden"),7000);}
function renderMailboxes(){const host=$("mailboxes");host.replaceChildren();STATE.mailboxes.forEach((box,index)=>{const button=document.createElement("button");button.className="nav mailbox"+(STATE.mailbox===box.id?" active":"");button.style.setProperty("--dot",COLORS[index%COLORS.length]);button.textContent=box.visible_addresses?.[0]||box.principal;button.title=box.principal;button.onclick=()=>{STATE.mailbox=STATE.mailbox===box.id?"":box.id;renderMailboxes();loadFeed();};host.append(button);});const unread=STATE.mailboxes.reduce((sum,box)=>sum+Number(box.unread_count||0),0);const inbox=STATE.mailboxes.reduce((sum,box)=>sum+Number(box.inbox_count||0),0);$("allCount").textContent=unread;$("inboxCount").textContent=inbox;parent.postMessage({type:"raydar-master-inbox-counts",unread},location.origin);$("from").innerHTML=STATE.mailboxes.filter(box=>box.capabilities?.send).flatMap(box=>(box.visible_addresses?.length?box.visible_addresses:[box.principal]).map(address=>`<option value="${esc(address)}" data-mailbox="${esc(box.id)}">${esc(address)}</option>`)).join("");}
function renderList(){const host=$("conversationList");host.replaceChildren();if(!STATE.rows.length){host.innerHTML='<div class="empty"><strong>No conversations here</strong><br />A confirmed empty result is different from a mailbox sync failure.</div>';return;}STATE.rows.forEach(row=>{const item=document.createElement("div");item.className="row"+(row.unread?" unread":"")+(STATE.selected===row.id?" active":"");item.tabIndex=0;item.innerHTML=`<button class="pick${STATE.chosen.has(row.id)?" on":""}" aria-label="Select conversation" aria-pressed="${STATE.chosen.has(row.id)}">${STATE.chosen.has(row.id)?"✓":""}</button><button class="star" aria-label="${row.starred?"Remove star":"Add star"}">${row.starred?"★":"☆"}</button><span><span class="who">${esc(name(row.participant_text))}</span><span class="subject">${esc(displayText(row.subject||"(no subject)"))}${row.message_count>1?` · ${row.message_count}`:""}</span><span class="snippet">${esc(displayText(row.snippet))}</span><span class="badge">${esc(mailboxLabel(row.mailbox_ids?.[0]))}${row.has_attachment?" · attachment":""}</span></span><time class="time">${time(row.newest_at)}</time>`;item.onclick=event=>{if(event.target.closest(".pick")){if(STATE.chosen.has(row.id))STATE.chosen.delete(row.id);else if(STATE.chosen.size<25)STATE.chosen.add(row.id);else toast("Bulk actions are limited to 25 conversations at a time.");renderList();renderBulk();}else if(event.target.closest(".star")){action(row.starred?"unstar":"star",false,row.action_targets||row.action_target);}else openConversation(row);};item.onkeydown=event=>{if(event.key==="Enter")openConversation(row);};host.append(item);});}
function renderBulk(){const visible=STATE.chosen.size>0;$("bulkRead").classList.toggle("hidden",!visible);$("bulkArchive").classList.toggle("hidden",!visible);}
function demoThread(row){return {id:row.id,subject:row.subject,incomplete:false,messages:[{id:"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa",mailbox_id:row.mailbox_ids[0],provider_message_id:"demo-message",direction:"inbound",from_json:[{name:name(row.participant_text),address:"maya@example.com"}],to_json:[{address:mailboxLabel(row.mailbox_ids[0])}],subject:row.subject,safe_text:`Hi David,\n\n${row.snippet}\n\nBest,\n${name(row.participant_text).split(" ")[0]}`,safe_html:"",internal_date:row.newest_at,attachments:row.has_attachment?[{id:"bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb",filename:"resume.pdf",state:"available",size_bytes:184220}]:[]}],userState:[]};}
async function openConversation(row){STATE.listScroll=window.scrollY;STATE.selected=row.id;document.body.classList.add("reading");renderList();$("reader").innerHTML='<div class="empty">Loading conversation…</div>';try{let thread;if(DEMO)thread=demoThread(row);else{const response=await fetch(`/api/master-inbox/thread?id=${encodeURIComponent(row.id)}`,{cache:"no-store"});const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error);thread=data.conversation;}STATE.thread=thread;renderThread();history.replaceState({masterInbox:{folder:STATE.folder,mailbox:STATE.mailbox,query:STATE.query,selected:row.id,scroll:STATE.listScroll}},"",`#conversation=${row.id}`);if(row.unread&&!DEMO)await action("read",true);}catch(error){$("reader").innerHTML='<div class="empty">This conversation could not be loaded; the list remains available.</div>';}}
function renderThread(){
  const thread=STATE.thread;if(!thread)return;
  const threadMessages=thread.messages||[];
  const messages=threadMessages.map((message,index)=>{
    const from=firstContact(message.from_json)||{};
    const initials=(from.name||from.address||"?").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();
    const recipients=[...contacts(message.to_json),...contacts(message.cc_json),...contacts(message.bcc_json)].map(item=>item.address).filter(Boolean).join(", ");
    const attachments=(message.attachments||[]).map(item=>item.state==="available"?`<a class="attachment" href="/api/master-inbox/attachment?id=${encodeURIComponent(item.id)}">${esc(item.filename)}</a>`:`<span class="attachment">${esc(item.filename)} · ${esc(item.state)}</span>`).join("");
    const meta=`<div class="meta"><span class="avatar">${esc(initials)}</span><span><strong>${esc(from.name||from.address||"Unknown sender")}</strong><small>to ${esc(recipients)} · ${time(message.internal_date)}${message.send_state?` · ${esc(message.send_state)}`:""}</small></span></div>`;
    const content=`<div class="body">${message.safe_html||`<p>${esc(message.safe_text).replace(/\n/g,"<br>")}</p>`}</div>${attachments?`<div class="attachments">${attachments}</div>`:""}`;
    return index===threadMessages.length-1?`<section class="reader-message">${meta}${content}</section>`:`<details class="reader-message"><summary>${meta}</summary>${content}</details>`;
  }).join("");
  const providerDraft=!thread.recordType&&threadMessages.at(-1)?.direction==="draft";
  const controls=thread.recordType==="draft"?'<button class="primary" id="editDraft">Edit draft</button>':thread.recordType==="send"?`<span class="badge">${esc(thread.sendState||"queued")}</span>${thread.sendState==="held"?'<button class="ghost" id="cancelScheduled">Cancel send</button>':""}`:providerDraft?'<button class="primary" id="continueDraft">Continue as Raydar draft</button>':'<button class="primary" id="reply">↩ Reply</button><button class="ghost" id="replyAll">Reply all</button><button class="ghost" id="forward">Forward</button>';
  const tags=(thread.userState||[]).filter(item=>item.kind==="tag").map(item=>`<span class="badge">${esc(item.value)}</span>`).join(" ");
  const snooze=(thread.userState||[]).find(item=>item.kind==="snooze"&&item.due_at&&new Date(item.due_at)>new Date());
  $("reader").innerHTML=`${thread.incomplete?'<div class="stale">Some history is still being repaired; confirmed messages remain visible.</div>':""}<h2>${esc(displayText(thread.subject||"(no subject)"))}</h2>${tags||snooze?`<div>${tags}${snooze?` <span class="badge">Snoozed until ${esc(new Date(snooze.due_at).toLocaleString())}</span>`:""}</div>`:""}${messages}<div class="actions">${controls}</div>`;
  if(thread.recordType==="draft")$("editDraft").onclick=()=>openComposer("edit");
  else if(thread.recordType==="send"&&thread.sendState==="held")$("cancelScheduled").onclick=()=>cancelHeldSend(thread.id);
  else if(providerDraft)$("continueDraft").onclick=()=>openComposer("continue-draft");
  else if(!thread.recordType){$("reply").onclick=()=>openComposer("reply");$("replyAll").onclick=()=>openComposer("reply-all");$("forward").onclick=()=>{if(confirm("Forwarding may disclose the full thread to an external recipient; continue?"))openComposer("forward");};}
  $("reader").querySelectorAll("a[href^='http']").forEach(link=>link.onclick=event=>{if(!confirm(`Open this external destination?\n${link.href}`))event.preventDefault();});
}
async function loadFeed(append=false){if(STATE.loading)return;STATE.loading=true;$("status").textContent="Reading shared store…";try{let data;if(DEMO)data={ok:true,rows:append?[]:DEMO_ROWS,mailboxes:DEMO_BOXES,cursor:null,hasMore:false,freshness:{source:"synthetic_preview",confirmed:true}};else{const params=new URLSearchParams({folder:STATE.folder,limit:"50"});if(STATE.mailbox)params.set("mailbox",STATE.mailbox);if(STATE.query)params.set("q",STATE.query);if(append&&STATE.cursor)params.set("cursor",STATE.cursor);const response=await fetch(`/api/master-inbox/feed?${params}`,{cache:"no-store"});data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error);}STATE.rows=append?[...STATE.rows,...(data.rows||[])]:data.rows||[];STATE.cursor=data.cursor||null;STATE.hasMore=Boolean(data.hasMore&&data.cursor);STATE.mailboxes=data.mailboxes||STATE.mailboxes;renderMailboxes();renderList();$("loadMore").classList.toggle("hidden",!STATE.hasMore);$("status").textContent=DEMO?"Synthetic preview · no mailbox connected":"Shared store current";}catch(error){$("status").textContent="Shared store unavailable";if(!STATE.rows.length)$("conversationList").innerHTML='<div class="empty"><strong>Mail is unavailable, not empty</strong><br />Last-known-good data will remain visible whenever it exists.</div>';}finally{STATE.loading=false;}}
async function action(kind,quiet=false,target=null){const threadTargets=(STATE.thread?.messages||[]).filter(message=>message.provider_message_id).map(message=>({mailboxId:message.mailbox_id,providerMessageId:message.provider_message_id}));target=target||(threadTargets.length?threadTargets:null);if(!target)return;if(DEMO){if(!quiet)toast(`${kind} would be verified with Gmail before it is shown as complete.`);return;}try{const payload=Array.isArray(target)?{targets:target}:{...target};const response=await fetch("/api/master-inbox/action",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({...payload,action:kind,idempotencyKey:crypto.randomUUID()})});const data=await response.json();if(!response.ok)throw new Error(data.error);if(!quiet)toast(data.state==="repair"?"At least one Gmail copy needs repair.":`${kind} verified with Gmail.`);if(!quiet)loadFeed();}catch(error){if(!quiet)toast("The action was not confirmed, so the message was not shown as changed.");}}
async function bulk(kind){const rows=STATE.rows.filter(row=>STATE.chosen.has(row.id)&&(row.action_targets||row.action_target));for(const row of rows)await action(kind,true,row.action_targets||row.action_target);toast(`${kind} requested for ${rows.length} conversation${rows.length===1?"":"s"}; each copy requires Gmail readback.`);STATE.chosen.clear();renderBulk();loadFeed();}
async function organize(kind){if(!STATE.thread)return;let value="",dueAt=null;if(kind==="tag"){value=prompt("Raydar tag name");if(!value)return;}else{const due=new Date();due.setDate(due.getDate()+1);due.setHours(8,0,0,0);dueAt=due.toISOString();}if(DEMO){toast(kind==="tag"?`Tag “${value}” would be shared in Raydar.`:"Snoozed until tomorrow at 8:00 AM.");return;}const response=await fetch("/api/master-inbox/action",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({scope:"raydar",conversationId:STATE.thread.id,kind,value,dueAt})});const data=await response.json();if(response.ok&&data.ok){STATE.thread.userState=[...(STATE.thread.userState||[]).filter(item=>!(item.kind===kind&&(kind==="snooze"||item.value===value))),{kind,value,due_at:dueAt}];renderThread();loadFeed();toast(`${kind} saved in Raydar.`);}else toast("The organization change could not be saved.");}
function selectedSignature(){return mailbox($("from").selectedOptions[0]?.dataset.mailbox)?.default_signature||"";}
function openComposer(mode="new"){
  STATE.composeMode=mode;const message=STATE.thread?.messages?.at(-1);$("composeForm").reset();STATE.draft=null;
  const preferred=mode!=="new"&&message?mailboxLabel(message.mailbox_id):mailboxLabel(STATE.mailbox);
  if(preferred&&[...$("from").options].some(option=>option.value===preferred))$("from").value=preferred;
  STATE.composeSignature=selectedSignature();if(mode==="new")$("body").value=STATE.composeSignature;
  if(mode!=="new"&&message){
    const address=mailboxLabel(message.mailbox_id);$("from").value=address;STATE.composeSignature=selectedSignature();
    if(mode==="edit"||mode==="continue-draft"){
      if(mode==="edit")STATE.draft={id:STATE.thread.id,revision:STATE.thread.revision};
      $("to").value=(message.to_json||[]).map(item=>item.address).join(", ");$("cc").value=(message.cc_json||[]).map(item=>item.address).join(", ");$("bcc").value=(message.bcc_json||[]).map(item=>item.address).join(", ");$("subject").value=message.subject||"";$("body").value=message.safe_text||"";
    }else{
      $("to").value=mode.startsWith("reply")?(message.from_json?.[0]?.address||""):"";
      if(mode==="reply-all"){const all=[...(message.to_json||[]),...(message.cc_json||[])].map(item=>item.address).filter(item=>item&&item!==address&&item!==$("to").value);$("cc").value=[...new Set(all)].join(", ");}
      $("subject").value=mode==="forward"?`Fwd: ${message.subject}`:/^re:/i.test(message.subject)?message.subject:`Re: ${message.subject}`;$("body").value=mode==="forward"?`${STATE.composeSignature}\n\n---------- Forwarded message ----------\n${message.safe_text||""}`:`\n\n${STATE.composeSignature}`;
    }
  }
  $("draftStatus").textContent="Saved only in Raydar";$("composer").showModal();$("to").focus();
}
async function saveDraft(){const selected=$("from").selectedOptions[0];const recipients=id=>$(id).value.split(",").map(value=>value.trim()).filter(Boolean).map(address=>({address}));const message=STATE.thread?.messages?.at(-1);const replying=STATE.composeMode==="reply"||STATE.composeMode==="reply-all";const continuing=STATE.composeMode==="continue-draft";const editing=STATE.composeMode==="edit";const references=replying?[...(message?.references_header||[]),message?.rfc_message_id].filter(Boolean).join(" "):(continuing||editing)?(message?.references_header||[]).join(" "):null;const input={id:STATE.draft?.id,revision:STATE.draft?.revision,mailboxId:selected?.dataset.mailbox,conversationId:(replying||continuing)?STATE.thread?.id:null,fromAddress:$("from").value,to:recipients("to"),cc:recipients("cc"),bcc:recipients("bcc"),subject:$("subject").value,bodyText:$("body").value,bodyHtml:"",inReplyTo:replying?(message?.rfc_message_id||null):(continuing||editing)?(message?.in_reply_to||null):null,references,scheduledFor:$("schedule").value?new Date($("schedule").value).toISOString():null};if(DEMO){STATE.draft={...input,id:"dddddddd-dddd-4ddd-8ddd-dddddddddddd",revision:(STATE.draft?.revision||0)+1};$("draftStatus").textContent="Synthetic draft saved";return STATE.draft;}const response=await fetch("/api/master-inbox/draft",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(input)});const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error);STATE.draft=data.draft;$("draftStatus").textContent="Draft saved";return STATE.draft;}
async function uploadFiles(draft){const rows=[];for(const file of $("files").files){const digest=Array.from(new Uint8Array(await crypto.subtle.digest("SHA-256",await file.arrayBuffer()))).map(byte=>byte.toString(16).padStart(2,"0")).join("");const metadata={draftId:draft.id,filename:file.name,contentType:file.type||"application/octet-stream",sizeBytes:file.size,digest};const prepared=await fetch("/api/master-inbox/draft-attachment",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({...metadata,action:"prepare"})}).then(r=>r.json());if(!prepared.ok)throw new Error(prepared.error);const put=await fetch(prepared.uploadUrl,{method:"PUT",headers:{"content-type":metadata.contentType,"x-amz-meta-sha256":digest,"x-amz-server-side-encryption":"AES256"},body:file});if(!put.ok)throw new Error("upload_failed");const committed=await fetch("/api/master-inbox/draft-attachment",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({...metadata,action:"commit",key:prepared.key})}).then(r=>r.json());if(!committed.ok)throw new Error(committed.error);rows.push(committed.attachment);}return rows;}
async function persistDraft(){const draft=await saveDraft();if(!DEMO&&$("files").files.length){$("draftStatus").textContent="Scanning attachments…";const attachments=await uploadFiles(draft);$("files").value="";const unavailable=attachments.find(item=>item.state!=="available");if(unavailable){$("draftStatus").textContent=unavailable.state==="pending"?"Attachment is still scanning; try Send again shortly.":`Attachment blocked: ${unavailable.state}.`;throw new Error($("draftStatus").textContent);}$("draftStatus").textContent="Draft and attachments saved";}return draft;}
async function cancelHeldSend(sendId){if(DEMO){toast("Synthetic send cancelled.");return;}const response=await fetch("/api/master-inbox/send",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action:"cancel",sendId})});const data=await response.json();if(!response.ok||!data.ok)return toast("This send can no longer be cancelled.");toast("Send cancelled.");loadFeed();}
async function send(){try{if(!$("composeForm").reportValidity())return;const draft=await persistDraft();if(DEMO){$("composer").close();toast("Synthetic send held for 10 seconds.","Undo",()=>cancelHeldSend(draft.id));return;}const response=await fetch("/api/master-inbox/send",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({draftId:draft.id,revision:draft.revision,idempotencyKey:crypto.randomUUID(),scheduledFor:draft.scheduled_for})});const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error);STATE.send=data;$("composer").close();toast(draft.scheduled_for?`Scheduled for ${new Date(draft.scheduled_for).toLocaleString()}.`:"Send is on a real 10-second hold.","Undo",()=>cancelHeldSend(data.id));}catch(error){$("draftStatus").textContent=`Could not send: ${error.message}`;}}
async function init(){if(DEMO){STATE.mailboxes=DEMO_BOXES;renderMailboxes();return loadFeed();}let config={};try{config=await fetch("/api/seq/config",{cache:"no-store"}).then(r=>r.json());}catch{}if(!config.authRequired){$("gate").classList.remove("hidden");$("gateError").textContent="Google sign-in is not configured, so Master Inbox is fail-closed.";return;}const session=await RaydarAuth.session().catch(()=>null);if(session?.authenticated)return loadFeed();$("gate").classList.remove("hidden");const start=()=>{if(!(window.google&&google.accounts?.id))return setTimeout(start,150);google.accounts.id.initialize({client_id:config.googleClientId,callback:async response=>{try{await RaydarAuth.signIn(response.credential);$("gate").classList.add("hidden");loadFeed();}catch{$("gateError").textContent="Sign-in failed — try again.";}}});google.accounts.id.renderButton($("gsi"),{theme:"filled_black",size:"large",text:"signin_with",shape:"pill"});};start();}
document.querySelectorAll("[data-folder]").forEach(button=>button.onclick=()=>{STATE.folder=button.dataset.folder;STATE.mailbox="";document.querySelectorAll("[data-folder]").forEach(item=>item.classList.toggle("active",item===button));$("viewTitle").textContent=button.childNodes[0].textContent.trim();const restore=["spam","trash"].includes(STATE.folder);$("archiveAction").dataset.action=restore?"restore":"archive";$("archiveAction").textContent=restore?"Restore":"Archive";renderMailboxes();loadFeed();});
document.querySelectorAll("[data-action]").forEach(button=>button.onclick=()=>action(button.dataset.action));
document.querySelectorAll("[data-organize]").forEach(button=>button.onclick=()=>organize(button.dataset.organize));
$("bulkRead").onclick=()=>bulk("read");$("bulkArchive").onclick=()=>bulk("archive");
$("compose").onclick=()=>openComposer();$("saveDraft").onclick=()=>persistDraft().catch(error=>$("draftStatus").textContent=error.message);$("send").onclick=send;$("from").onchange=()=>{const next=selectedSignature();if(!$("body").value.trim()||$("body").value.trim()===STATE.composeSignature.trim())$("body").value=next;STATE.composeSignature=next;};$("scheduleLabel").title=`Times use ${Intl.DateTimeFormat().resolvedOptions().timeZone}`;$("refresh").onclick=()=>loadFeed();$("loadMore").onclick=()=>loadFeed(true);$("print").onclick=()=>window.print();$("exportMessage").onclick=()=>{const id=STATE.thread?.messages?.at(-1)?.id;if(!id)return;if(DEMO)return toast("A safe individual-message export would download here.");location.href=`/api/master-inbox/message-export?id=${encodeURIComponent(id)}`;};$("reportProblem").onclick=async()=>{const note=prompt("Briefly describe what looks wrong (optional):","");if(note===null)return;if(DEMO)return toast(`Synthetic problem report saved for ${STATE.selected||"this screen"}.`);try{const response=await fetch("/api/master-inbox/report",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({conversationId:STATE.selected,note,context:{folder:STATE.folder,mailbox:STATE.mailbox}})});const data=await response.json();if(!response.ok||!data.ok)throw new Error(data.error);toast(`Problem reported; reference ${data.report.id}.`);}catch{toast("The report could not be saved; please copy the conversation URL and tell an administrator.");}};let searchTimer;$("search").oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(()=>{STATE.query=$("search").value;loadFeed();},300);};init();
let autosaveTimer;$("composeForm").addEventListener("input",()=>{clearTimeout(autosaveTimer);$("draftStatus").textContent="Saving…";autosaveTimer=setTimeout(()=>saveDraft().catch(error=>$("draftStatus").textContent=`Not saved: ${error.message}`),900);});
$("backList").onclick=()=>{document.body.classList.remove("reading");requestAnimationFrame(()=>scrollTo(0,STATE.listScroll));};
</script>
